[pytest]
# Issue #113: `tests` only, and deliberately NOT `services/*/tests` alongside
# it. Those in-service suites are real coverage this tree does not duplicate
# (see ci.yml's service-tests job), but they cannot share a pytest process
# with each other: every service ships a top-level package named `app`, so
# collecting more than one at a time resolves `app` to whichever landed on
# sys.path first and the rest fail to import. ci.yml runs each of them as its
# own invocation from its own directory instead.
testpaths = tests
asyncio_mode = auto
filterwarnings =
    error
    ignore::DeprecationWarning:qdrant_client.*
    ignore::DeprecationWarning:sqlmodel.*
    ignore::DeprecationWarning:pydantic.*
