[pytest]
# Issue #113: `tests` only, and deliberately NOT `services/*/tests` alongside
# it. Those in-service suites are real coverage this tree does not duplicate
# (see ci.yml's service-tests job), but they cannot share a pytest process
# with each other: every service ships a top-level package named `app`, so
# collecting more than one at a time resolves `app` to whichever landed on
# sys.path first and the rest fail to import. ci.yml runs each of them as its
# own invocation from its own directory instead.
testpaths = tests
asyncio_mode = auto
filterwarnings =
    error
    ignore::DeprecationWarning:qdrant_client.*
    ignore::DeprecationWarning:sqlmodel.*
    ignore::DeprecationWarning:pydantic.*
    # Issue #439: tests/integration talks to the dev stack's Qdrant over
    # plain HTTP on localhost (never TLS -- there's no cert for a host-only
    # loopback port), same as every in-cluster caller reaching it as
    # qdrant:6333 -- QDRANT__SERVICE__API_KEY (docker-compose.yml) is still
    # required and checked either way, this warning just flags the
    # transport, which network isolation (127.0.0.1-bound port) covers here.
    # No module segment (unlike the DeprecationWarning ignores above): this
    # warning is issued with stacklevel=4, so Python resolves its "module"
    # to whatever called QdrantClient(...) -- a different module for every
    # caller -- not qdrant_client itself, so a qdrant_client.* module filter
    # can never match it.
    ignore:Api key is used with an insecure connection:UserWarning
