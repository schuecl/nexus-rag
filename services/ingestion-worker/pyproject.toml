[project]
name = "ingestion-worker"
version = "0.1.0"
description = "Durable parse/chunk/embed/store pipeline (FR-3..FR-6), consuming NATS JetStream (NFR-11)"
requires-python = ">=3.11"
dependencies = [
    # #134: Ollama embedding call as a child span (app/main.py).
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "qdrant-client>=1.10",
    "prometheus-client>=0.20",
    # >=6.14.2 floor: pip-audit reports 35 published CVEs against the newest
    # 5.x, all fixed in the 6.x line. This parses attacker-supplied uploads
    # (FR-3), so a permissive floor matters -- an air-gapped mirror seeded
    # earlier (NFR-1) would otherwise resolve a vulnerable 4.x/5.x.
    "pypdf>=6.14.2",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    # #92: decode/size-filter embedded images before captioning; also what
    # pypdf itself requires for its image-extraction API.
    "pillow>=10.0",
    # #241: OCR wrapper; the tesseract binary itself comes from the Dockerfile.
    "pytesseract>=0.3.10",
    "beautifulsoup4>=4.12",
    "nexus-rag-common",
]

[project.optional-dependencies]
# pytest floor is 9.0.3, where PYSEC-2026-1845 is fixed (#188). These
# suites carry no BDD tests, so the pytest-bdd<9.1 ceiling that
# requirements-test.txt documents does not apply here.
# pytest-cov is a hard dependency here, not just a CI convenience: the
# `addopts` below passes --cov unconditionally, so a pytest without the plugin
# fails on "unrecognized arguments" rather than merely skipping coverage.
test = ["pytest>=9.0.3", "pytest-asyncio>=0.24", "pytest-cov>=7.0"]

# The consumer loop is async (app/processing.py), so its tests are too --
# same configuration orchestration-mcp already uses.
[tool.pytest.ini_options]
asyncio_mode = "auto"
# #92: app/captioning.py joins the gated set. app/ocr.py (#241) moved back
# into ci.yml's matrix `cov` string once #256 decoupled the check name from
# that string -- see docs/testing.md's coverage-policy section. `--cov`
# appends, so this unions with the flags CI passes on the command line and
# the floor covers all four modules. pytest-cov is in requirements-test.txt,
# and CI installs it explicitly.
addopts = "--cov=app.captioning"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
explicit_package_bases = true

[[tool.mypy.overrides]]
# Issue #79: second app service promoted from types-apps (report-only) to
# the enforced `types` job in ci.yml. Scoped to app.* (not the whole config)
# because MYPYPATH=../common pulls services/common into this run too, and
# that package has its own separately-enforced (and currently looser) mypy
# settings -- this must not tighten them as a side effect.
module = ["app.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# common is already its own separately-enforced gate (`mypy services/common/
# common` in ci.yml's `types` job). follow_imports=silent still uses its real
# signatures to check app.* call sites, but stops this job from re-reporting
# common's own findings (e.g. boto3/fastembed lacking stubs, allowed there
# via that job's own ignore_missing_imports) under different settings here.
module = ["common.*"]
follow_imports = "silent"

[[tool.mypy.overrides]]
# openpyxl and pytesseract ship no stubs or py.typed marker.
module = ["openpyxl.*", "pytesseract.*"]
ignore_missing_imports = true
