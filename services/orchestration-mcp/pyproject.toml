[project]
name = "orchestration-mcp"
version = "0.1.0"
description = "Claims-filtered retrieval MCP server exposed to LibreChat (FR-24..FR-29)"
requires-python = ">=3.11"
dependencies = [
    # #134: Ollama + reranker hops as child spans, with context
    # propagation to reranker-service (app/server.py).
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "mcp>=1.6",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "qdrant-client>=1.10",
    "nexus-rag-common",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
