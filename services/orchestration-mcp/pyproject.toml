[project]
name = "orchestration-mcp"
version = "0.3.0"
description = "Claims-filtered retrieval MCP server exposed to LibreChat (FR-24..FR-29)"
requires-python = ">=3.11"
dependencies = [
    # #134: Ollama + reranker hops as child spans, with context
    # propagation to reranker-service (app/server.py).
    "opentelemetry-instrumentation-httpx>=0.51b0",
    # #205: mcp 2.0.0 removed/renamed mcp.server.fastmcp, which app/server.py
    # imports directly. Held below 2.0 until that import is migrated.
    "mcp>=1.6,<2.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "qdrant-client>=1.10",
    "nexus-rag-common",
]

[project.optional-dependencies]
# pytest floor is 9.0.3, where PYSEC-2026-1845 is fixed (#188). These
# suites carry no BDD tests, so the pytest-bdd<9.1 ceiling that
# requirements-test.txt documents does not apply here.
test = ["pytest>=9.0.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
explicit_package_bases = true

[[tool.mypy.overrides]]
# Issue #79: third app service promoted from types-apps (report-only) to
# the enforced `types` job in ci.yml. Scoped to app.* (not the whole config)
# because MYPYPATH=../common pulls services/common into this run too, and
# that package has its own separately-enforced (and currently looser) mypy
# settings -- this must not tighten them as a side effect.
module = ["app.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# common is already its own separately-enforced gate (`mypy services/common/
# common` in ci.yml's `types` job). follow_imports=silent still uses its real
# signatures to check app.* call sites, but stops this job from re-reporting
# common's own findings under different settings here.
module = ["common.*"]
follow_imports = "silent"
