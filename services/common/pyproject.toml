[project]
name = "nexus-rag-common"
version = "0.1.0"
description = "Shared claims parsing, metadata schema, Qdrant filter building, and DB models for nexus-rag services"
requires-python = ">=3.11"
dependencies = [
    # #134: distributed tracing (common/tracing.py); the exporter only
    # activates when OTEL_EXPORTER_OTLP_ENDPOINT is set.
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "pydantic>=2.7",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "sqlmodel>=0.0.21",
    "psycopg[binary]>=3.1",
    "qdrant-client>=1.10",
    # #160: optional Milvus backend (common/milvus_store.py); imported only
    # when VECTOR_BACKEND=milvus, but shipped so the toggle is config-only.
    "pymilvus>=2.5",
    "fastembed>=0.6",
    # NFR-12: S3ObjectStore backend (common/object_store.py) -- generic
    # S3-compatible client (existing enterprise S3, Ceph RGW, MinIO, ...),
    # not AWS-specific despite the package name.
    "boto3>=1.34",
    # NFR-11: durable ingestion job queue (common/job_queue.py).
    "nats-py>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*"]
