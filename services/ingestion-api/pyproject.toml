[project]
name = "ingestion-api"
version = "0.1.0"
description = "Upload, mandatory tagging, and curation queue API/UI (FR-1..FR-16)"
requires-python = ">=3.11"
dependencies = [
    # #134: request spans (FastAPIInstrumentor in app/main.py).
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "fastapi>=0.140.7",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.32",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "qdrant-client>=1.18.0",
    # #164: the /metrics scrape surface (app/metrics.py). Declared here like
    # the other three services do -- without it the image builds fine and
    # then the container exits on `import prometheus_client` at startup.
    "prometheus-client>=0.20",
    "nexus-rag-common",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

# The upload path is async, so its tests are too -- same configuration
# ingestion-worker and orchestration-mcp already use.
[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
explicit_package_bases = true

[[tool.mypy.overrides]]
# Issue #79: last app service promoted from types-apps (report-only) to the
# enforced `types` job in ci.yml. Scoped to app.* (not the whole config)
# because MYPYPATH=../common pulls services/common into this run too, and
# that package has its own separately-enforced (and currently looser) mypy
# settings -- this must not tighten them as a side effect.
module = ["app.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# common is already its own separately-enforced gate (`mypy services/common/
# common` in ci.yml's `types` job). follow_imports=silent still uses its real
# signatures to check app.* call sites, but stops this job from re-reporting
# common's own findings under different settings here.
module = ["common.*"]
follow_imports = "silent"
