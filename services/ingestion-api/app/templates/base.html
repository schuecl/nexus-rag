<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}nexus-rag{% endblock %}</title>
  <style>
    .linklike { background: none; border: none; padding: 0; color: #06c; text-decoration: underline; cursor: pointer; font: inherit; }
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; }
    label { display: block; margin-top: 0.75rem; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 0.4rem; margin-top: 0.25rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    .row { display: flex; gap: 1rem; justify-content: space-between; align-items: center; border: 1px solid #ccc; padding: 0.5rem; margin-top: 0.5rem; }
    .msg { margin-top: 1rem; padding: 0.5rem; white-space: pre-wrap; }
    .msg.ok { background: #e6ffed; }
    .msg.err { background: #ffe6e6; }
    .hint { color: #666; font-size: 0.85rem; font-weight: normal; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Upload</a>
    <a href="/curate">Curation Queue</a>
    <a href="/notifications">Notifications</a>
    <a href="/search">Search</a>
    {% if current_user %}
    <span class="hint">Logged in as <strong>{{ current_user.preferred_username }}</strong></span>
    <!-- Issue #215: logout is a state change, so it goes through POST with
         the same CSRF header every other state-changing request carries. -->
    <button type="button" class="linklike" onclick="logout()">Log out</button>
    {% else %}
    <a href="/auth/login">Log in</a>
    {% endif %}
  </nav>
  <hr />
  {% block content %}{% endblock %}
  <script>
    // Auth is a browser session cookie now (ARCHITECTURE.md Section 4.4,
    // set by /auth/login -> /auth/callback) -- fetch() already sends it
    // same-origin, so there's no Authorization header to attach here. What
    // this still needs to attach is the CSRF token (NFR-14, deps.verify_csrf):
    // the session cookie alone rides along on a forged cross-site request,
    // but this app's own JS is the only thing that can read the sibling
    // nexus_rag_csrf cookie (not HttpOnly, unlike the session cookie) and
    // echo it back as a header -- a cross-site attacker can't.
    function authHeaders() {
      const match = document.cookie.match(/(?:^|; )nexus_rag_csrf=([^;]*)/);
      return match ? { 'X-CSRF-Token': decodeURIComponent(match[1]) } : {};
    }

    // Issue #215: POST, so the CSRF check applies and a third-party page
    // can't log the user out by embedding the URL. The server answers 303,
    // so fetch() follows the RP-initiated logout redirect through Keycloak
    // with GET; we then land the browser wherever it ended up.
    async function logout() {
      const res = await fetch('/auth/logout', { method: 'POST', headers: authHeaders() });
      window.location.href = res.url || '/';
    }
  </script>
</body>
</html>
