{% extends "base.html" %}
{% block title %}Notifications — nexus-rag{% endblock %}
{% block content %}
<h1>Notifications</h1>
<p>Decisions on documents you submitted (FR-15). Unread ones are highlighted.</p>
<button onclick="loadNotifications()">Refresh</button>
<div id="notifications"></div>

<script>
async function loadNotifications() {
  const res = await fetch('/notifications', { headers: authHeaders() });
  const el = document.getElementById('notifications');
  if (!res.ok) {
    el.textContent = 'Error: ' + res.status + ' ' + (await res.text());
    return;
  }
  const notifications = await res.json();
  el.innerHTML = '';
  if (notifications.length === 0) {
    el.textContent = 'No notifications yet.';
    return;
  }
  for (const n of notifications) {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.background = n.read ? '' : '#fff8e1';

    // Issue #207: n.message embeds the uploader's filename and the curator's
    // free-text rejection reason. Both were interpolated into innerHTML here,
    // so a crafted filename executed in the uploader's own session. Built as
    // text nodes now -- the message is prose to read, never markup to parse.
    const body = document.createElement('div');
    const heading = document.createElement('strong');
    heading.textContent = n.decision === 'approved' ? '✅ Approved' : '❌ Rejected';
    const stamp = document.createElement('span');
    stamp.className = 'hint';
    stamp.textContent = new Date(n.created_at).toLocaleString();
    body.append(heading, document.createElement('br'),
                n.message, document.createElement('br'), stamp);

    const actions = document.createElement('div');
    if (!n.read) {
      const btn = document.createElement('button');
      btn.textContent = 'Mark read';
      btn.addEventListener('click', () => markRead(n.id));
      actions.append(btn);
    }

    row.append(body, actions);
    el.appendChild(row);
  }
}

async function markRead(id) {
  await fetch(`/notifications/${id}/read`, { method: 'POST', headers: authHeaders() });
  loadNotifications();
}

loadNotifications();
</script>
{% endblock %}
