# Mirrored byte-for-byte at helm/nexus-rag/files/nats.conf (Helm charts can't
# reference files outside their own directory) -- kept in sync by
# scripts/check_nats_conf_sync.py in CI. Edit here, then copy over there.
#
# Issue #212: per-subject NATS permissions, replacing the single shared
# --auth token that let either service publish and consume everything.
# ingestion-api only ever needs to publish a job and idempotently ensure the
# stream exists (common/job_queue.py); ingestion-worker only ever needs to
# consume it. Splitting credentials means a compromise of either service's
# token can no longer forge messages *and* replay/drain the queue -- at
# worst it can do the one job it already had permission to do.
#
# Validated end-to-end against a live nats-server (2.14.3): stream/durable
# consumer creation (idempotent across restarts), publish, pull-fetch, ack,
# and both deny directions (ingestion_api cannot pull_subscribe;
# ingestion_worker cannot publish to ingestion.jobs).
#
# `$JS.API.STREAM.NAMES` and the `_INBOX.>` subscribe grant are not optional
# extras -- nats-py's pull_subscribe()/JetStream API calls are all
# request-reply under the hood (stream lookup by subject, consumer
# create/info, ack), and every one of those replies arrives on the caller's
# own inbox subject.
authorization {
  users = [
    {
      user: "ingestion_api"
      password: $NATS_INGESTION_API_PASSWORD
      permissions: {
        publish: {
          allow: [
            "ingestion.jobs"
            "$JS.API.STREAM.INFO.INGESTION_JOBS"
            "$JS.API.STREAM.CREATE.INGESTION_JOBS"
          ]
        }
        subscribe: {
          allow: ["_INBOX.>"]
        }
      }
    }
    {
      user: "ingestion_worker"
      password: $NATS_INGESTION_WORKER_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.STREAM.NAMES"
            "$JS.API.STREAM.INFO.INGESTION_JOBS"
            "$JS.API.STREAM.CREATE.INGESTION_JOBS"
            "$JS.API.CONSUMER.CREATE.INGESTION_JOBS.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.INGESTION_JOBS.*"
            "$JS.API.CONSUMER.INFO.INGESTION_JOBS.*"
            "$JS.API.CONSUMER.MSG.NEXT.INGESTION_JOBS.*"
            "$JS.ACK.INGESTION_JOBS.>"
          ]
        }
        subscribe: {
          allow: ["_INBOX.>"]
        }
      }
    }
  ]
}
