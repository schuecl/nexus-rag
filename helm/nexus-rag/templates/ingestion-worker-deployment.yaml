{{- if .Values.ingestionWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus-rag.fullname" . }}-ingestion-worker
  labels:
    {{- include "nexus-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion-worker
spec:
  replicas: {{ .Values.ingestionWorker.replicas }}
  selector:
    matchLabels:
      {{- include "nexus-rag.componentSelectorLabels" (dict "root" . "component" "ingestion-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-rag.labels" . | nindent 8 }}
        app.kubernetes.io/component: ingestion-worker
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "nexus-rag.podSecurityContext" . | nindent 8 }}
      containers:
        - name: ingestion-worker
          image: {{ include "nexus-rag.image" (dict "global" .Values.global "image" .Values.ingestionWorker.image) }}
          securityContext:
            {{- include "nexus-rag.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8004
          volumeMounts:
            {{- if and .Values.observability.siem.syslogHost (eq .Values.observability.siem.syslogProtocol "tls") }}
            {{- if .Values.observability.siem.tls.caCertSecret }}
            - name: siem-ca
              mountPath: /etc/nexus-rag/siem-ca
              readOnly: true
            {{- end }}
            {{- if .Values.observability.siem.tls.clientCertSecret }}
            - name: siem-client
              mountPath: /etc/nexus-rag/siem-client
              readOnly: true
            {{- end }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
            # common.sparse_embedding's BM25 model cache (HF_HOME in the
            # Dockerfile) -- see ingestion-api-deployment.yaml's identical
            # note on why this is an emptyDir rather than a PVC.
            - name: hf-cache
              mountPath: /srv/.cache/huggingface
          env:
            # #73: log verbosity/format, and NFR-2 SIEM export (disabled when
            # syslogHost is empty).
            - name: LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.observability.logFormat | quote }}
            # #160: either/or vector backend; qdrant is the default and the
            # MILVUS_* env only renders when the deployment opts in.
            - name: VECTOR_BACKEND
              value: {{ .Values.vectorBackend | quote }}
            {{- if eq .Values.vectorBackend "milvus" }}
            - name: MILVUS_URL
              value: http://{{ include "nexus-rag.fullname" . }}-milvus:19530
            {{- if .Values.milvus.auth.existingSecret }}
            - name: MILVUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.milvus.auth.existingSecret }}
                  key: {{ .Values.milvus.auth.secretKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.observability.tracing.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.tracing.otlpEndpoint | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.observability.tracing.samplerRatio | quote }}
            {{- end }}
            {{- if .Values.observability.siem.syslogHost }}
            - name: SIEM_SYSLOG_HOST
              value: {{ .Values.observability.siem.syslogHost | quote }}
            - name: SIEM_SYSLOG_PORT
              value: {{ .Values.observability.siem.syslogPort | quote }}
            - name: SIEM_SYSLOG_PROTOCOL
              value: {{ .Values.observability.siem.syslogProtocol | quote }}
            - name: SIEM_SYSLOG_FACILITY
              value: {{ .Values.observability.siem.facility | quote }}
            {{- if eq .Values.observability.siem.syslogProtocol "tls" }}
            - name: SIEM_SYSLOG_TLS_VERIFY
              value: {{ .Values.observability.siem.tls.verify | quote }}
            {{- if .Values.observability.siem.tls.caCertSecret }}
            - name: SIEM_SYSLOG_CA_CERT
              value: /etc/nexus-rag/siem-ca/ca.crt
            {{- end }}
            {{- if .Values.observability.siem.tls.clientCertSecret }}
            - name: SIEM_SYSLOG_CLIENT_CERT
              value: /etc/nexus-rag/siem-client/tls.crt
            - name: SIEM_SYSLOG_CLIENT_KEY
              value: /etc/nexus-rag/siem-client/tls.key
            {{- end }}
            {{- end }}
            {{- end }}
            # NFR-3: non-superuser app role, distinct from POSTGRES_USER.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalPostgres.existingSecret }}
                  # #278: this service's own role, falling back to the
                  # shared pre-#278 credential when unset.
                  key: {{ .Values.externalPostgres.perServiceKeys.ingestionWorker | default .Values.externalPostgres.secretKey }}
            - name: QDRANT_URL
              value: "http://{{ include "nexus-rag.fullname" . }}-qdrant:{{ .Values.qdrant.service.httpPort }}"
            # NFR-15: full read/write key -- this is the service that now
            # creates the collection and writes new points (moved out of
            # ingestion-api).
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qdrant.apiKey.existingSecret }}
                  key: {{ .Values.qdrant.apiKey.secretKey }}
            - name: OLLAMA_URL
              value: "http://{{ include "nexus-rag.fullname" . }}-embedding-service:{{ .Values.embeddingService.service.port }}"
            - name: EMBEDDING_MODEL
              value: {{ .Values.embeddingService.model | quote }}
            {{- if .Values.ingestionWorker.visionModel }}
            # Issue #92: opt-in image/figure captioning at ingestion. Absent
            # (not just empty) when unset, matching the code's
            # empty-means-disabled default in app/captioning.py.
            - name: VISION_MODEL
              value: {{ .Values.ingestionWorker.visionModel | quote }}
            {{- end }}
            {{- if .Values.ingestionWorker.classificationModel }}
            # Issue #308: opt-in LLM zero-shot classification suggestion at
            # ingestion. Absent (not just empty) when unset, matching the
            # code's empty-means-disabled default in
            # app/classification_suggestion.py.
            - name: CLASSIFICATION_MODEL
              value: {{ .Values.ingestionWorker.classificationModel | quote }}
            {{- end }}
            # FR-4: chunking target size (words) and overlap ratio.
            - name: CHUNK_TARGET_WORDS
              value: {{ .Values.ingestionWorker.chunkTargetWords | quote }}
            - name: CHUNK_OVERLAP_RATIO
              value: {{ .Values.ingestionWorker.chunkOverlapRatio | quote }}
            # NFR-12: durable original-file storage (common/object_store.py).
            - name: OBJECT_STORE_BACKEND
              value: "s3"
            - name: OBJECT_STORE_S3_ENDPOINT
              value: {{ .Values.externalObjectStore.endpoint | quote }}
            - name: OBJECT_STORE_S3_BUCKET
              value: {{ .Values.externalObjectStore.bucket | quote }}
            - name: OBJECT_STORE_S3_REGION
              value: {{ .Values.externalObjectStore.region | quote }}
            - name: OBJECT_STORE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalObjectStore.existingSecret }}
                  key: {{ .Values.externalObjectStore.accessKeySecretKey }}
            - name: OBJECT_STORE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalObjectStore.existingSecret }}
                  key: {{ .Values.externalObjectStore.secretKeySecretKey }}
            # NFR-11: durable ingestion queue -- ingestion-api publishes,
            # this service is the durable JetStream consumer. Issue #212:
            # consume-only credential -- nats-configmap.yaml's permissions
            # deny this user publish on the data subject itself, only the
            # JetStream consumer/ack API subjects it needs to pull and
            # acknowledge jobs.
            - name: NATS_URL
              value: "nats://{{ include "nexus-rag.fullname" . }}-nats:{{ .Values.nats.service.clientPort }}"
            - name: NATS_USER
              value: "ingestion_worker"
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.credentials.ingestionWorker.existingSecret }}
                  key: {{ .Values.nats.credentials.ingestionWorker.secretKey }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ingestionWorker.resources | nindent 12 }}
      volumes:
        {{- if and .Values.observability.siem.syslogHost (eq .Values.observability.siem.syslogProtocol "tls") }}
        {{- if .Values.observability.siem.tls.caCertSecret }}
        - name: siem-ca
          secret:
            secretName: {{ .Values.observability.siem.tls.caCertSecret }}
        {{- end }}
        {{- if .Values.observability.siem.tls.clientCertSecret }}
        - name: siem-client
          secret:
            secretName: {{ .Values.observability.siem.tls.clientCertSecret }}
        {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: hf-cache
          emptyDir: {}
{{- end }}
