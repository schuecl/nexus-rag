{{- if .Values.ingestionApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus-rag.fullname" . }}-ingestion-api
  labels:
    {{- include "nexus-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion-api
spec:
  replicas: {{ .Values.ingestionApi.replicas }}
  selector:
    matchLabels:
      {{- include "nexus-rag.componentSelectorLabels" (dict "root" . "component" "ingestion-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-rag.labels" . | nindent 8 }}
        app.kubernetes.io/component: ingestion-api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "nexus-rag.podSecurityContext" . | nindent 8 }}
      containers:
        - name: ingestion-api
          image: {{ include "nexus-rag.image" (dict "global" .Values.global "image" .Values.ingestionApi.image) }}
          securityContext:
            {{- include "nexus-rag.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8001
          volumeMounts:
            {{- if and .Values.observability.siem.syslogHost (eq .Values.observability.siem.syslogProtocol "tls") }}
            {{- if .Values.observability.siem.tls.caCertSecret }}
            - name: siem-ca
              mountPath: /etc/nexus-rag/siem-ca
              readOnly: true
            {{- end }}
            {{- if .Values.observability.siem.tls.clientCertSecret }}
            - name: siem-client
              mountPath: /etc/nexus-rag/siem-client
              readOnly: true
            {{- end }}
            {{- end }}
            # FastAPI/python-multipart spool uploaded files (FR-1) to /tmp
            # once they exceed an in-memory threshold; needed alongside
            # readOnlyRootFilesystem above.
            - name: tmp
              mountPath: /tmp
          env:
            # #73: log verbosity/format, and NFR-2 SIEM export (disabled when
            # syslogHost is empty).
            - name: LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.observability.logFormat | quote }}
            # #160: either/or vector backend -- exactly one of the
            # QDRANT_*/MILVUS_* blocks below renders, matching vectorBackend.
            - name: VECTOR_BACKEND
              value: {{ .Values.vectorBackend | quote }}
            {{- if eq .Values.vectorBackend "milvus" }}
            - name: MILVUS_URL
              value: {{ include "nexus-rag.milvusUrl" . | quote }}
            {{- if .Values.milvus.auth.existingSecret }}
            - name: MILVUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.milvus.auth.existingSecret }}
                  key: {{ .Values.milvus.auth.secretKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.observability.tracing.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.tracing.otlpEndpoint | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.observability.tracing.samplerRatio | quote }}
            {{- end }}
            {{- if .Values.observability.siem.syslogHost }}
            - name: SIEM_SYSLOG_HOST
              value: {{ .Values.observability.siem.syslogHost | quote }}
            - name: SIEM_SYSLOG_PORT
              value: {{ .Values.observability.siem.syslogPort | quote }}
            - name: SIEM_SYSLOG_PROTOCOL
              value: {{ .Values.observability.siem.syslogProtocol | quote }}
            - name: SIEM_SYSLOG_FACILITY
              value: {{ .Values.observability.siem.facility | quote }}
            {{- if eq .Values.observability.siem.syslogProtocol "tls" }}
            - name: SIEM_SYSLOG_TLS_VERIFY
              value: {{ .Values.observability.siem.tls.verify | quote }}
            {{- if .Values.observability.siem.tls.caCertSecret }}
            - name: SIEM_SYSLOG_CA_CERT
              value: /etc/nexus-rag/siem-ca/ca.crt
            {{- end }}
            {{- if .Values.observability.siem.tls.clientCertSecret }}
            - name: SIEM_SYSLOG_CLIENT_CERT
              value: /etc/nexus-rag/siem-client/tls.crt
            - name: SIEM_SYSLOG_CLIENT_KEY
              value: /etc/nexus-rag/siem-client/tls.key
            {{- end }}
            {{- end }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalPostgres.existingSecret }}
                  # #278: this service's own role, falling back to the
                  # shared pre-#278 credential when unset.
                  key: {{ .Values.externalPostgres.perServiceKeys.ingestionApi | default .Values.externalPostgres.secretKey }}
            - name: OIDC_ISSUERS
              value: {{ .Values.externalKeycloak.issuerUrl | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.externalKeycloak.audience | quote }}
            # Browser OIDC login (ARCHITECTURE.md Section 4.4).
            - name: OIDC_CLIENT_ID
              value: {{ .Values.externalKeycloak.clientId | quote }}
            - name: RAG_APP_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalKeycloak.clientSecret.existingSecret }}
                  key: {{ .Values.externalKeycloak.clientSecret.secretKey }}
            - name: OIDC_REDIRECT_URI
              value: {{ include "nexus-rag.oidcRedirectUri" . | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.ingestionApi.cookieSecure | quote }}
            # Issue #213: encrypts the UserSession rows this service writes
            # (common/token_crypto.py) so a read-only compromise of the app
            # database alone doesn't yield usable Keycloak credentials.
            - name: SESSION_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ingestionApi.sessionTokenEncryption.existingSecret }}
                  key: {{ .Values.ingestionApi.sessionTokenEncryption.secretKey }}
            {{- if .Values.ingestionApi.sessionTokenEncryption.previousExistingSecret }}
            # Issue #281 gap G5 stage 2: tried via MultiFernet if the key
            # above fails to decrypt a row -- set only while rotating.
            - name: SESSION_TOKEN_ENCRYPTION_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ingestionApi.sessionTokenEncryption.previousExistingSecret }}
                  key: {{ .Values.ingestionApi.sessionTokenEncryption.previousSecretKey }}
            {{- end }}
            {{- if eq .Values.vectorBackend "qdrant" }}
            - name: QDRANT_URL
              value: {{ include "nexus-rag.qdrantUrl" . | quote }}
            # NFR-15: full read/write key -- this service creates the
            # collection and writes/deletes points (common/qdrant_store.py).
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qdrant.apiKey.existingSecret }}
                  key: {{ .Values.qdrant.apiKey.secretKey }}
            {{- end }}
            - name: MAX_UPLOAD_BYTES
              value: {{ .Values.ingestionApi.maxUploadBytes | int64 | quote }}
            # Issue #356: batch-submission file-count cap (POST /documents/batch).
            # Was hardcoded to the app's own default (25) with no Helm value --
            # this exposes it the same way maxUploadBytes is exposed above.
            - name: MAX_BATCH_FILES
              value: {{ .Values.ingestionApi.maxBatchFiles | quote }}
            # Issue #279 (gap G3): see values.yaml's purgeTwoPersonRequired comment.
            - name: PURGE_TWO_PERSON_REQUIRED
              value: {{ .Values.ingestionApi.purgeTwoPersonRequired | quote }}
            - name: PURGE_REQUEST_EXPIRY_HOURS
              value: {{ .Values.ingestionApi.purgeRequestExpiryHours | quote }}
            # app/routes/search.py's query-testing page proxies here (ARCHITECTURE.md
            # Section 4.3's /debug/rag_search, same as docker-compose.yml's dev wiring).
            - name: ORCHESTRATION_MCP_URL
              value: "http://{{ include "nexus-rag.fullname" . }}-orchestration-mcp:{{ .Values.orchestrationMcp.service.port }}"
            # NFR-12: durable original-file storage (common/object_store.py).
            # Issue #404: objectStore.enabled selects the bundled SeaweedFS
            # instance instead of an external S3-compatible endpoint -- same
            # either/or as vectorBackend above, just without a second env var
            # to select it (the S3 wire protocol is identical either way).
            - name: OBJECT_STORE_BACKEND
              value: "s3"
            - name: OBJECT_STORE_S3_ENDPOINT
              value: {{ include "nexus-rag.objectStoreEndpoint" . | quote }}
            - name: OBJECT_STORE_S3_BUCKET
              value: {{ ternary .Values.objectStore.seaweedfs.bucket .Values.objectStore.external.bucket .Values.objectStore.enabled | quote }}
            - name: OBJECT_STORE_S3_REGION
              value: {{ ternary .Values.objectStore.seaweedfs.region .Values.objectStore.external.region .Values.objectStore.enabled | quote }}
            - name: OBJECT_STORE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ ternary .Values.objectStore.seaweedfs.auth.existingSecret .Values.objectStore.external.existingSecret .Values.objectStore.enabled }}
                  key: {{ ternary .Values.objectStore.seaweedfs.auth.accessKeySecretKey .Values.objectStore.external.accessKeySecretKey .Values.objectStore.enabled }}
            - name: OBJECT_STORE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ ternary .Values.objectStore.seaweedfs.auth.existingSecret .Values.objectStore.external.existingSecret .Values.objectStore.enabled }}
                  key: {{ ternary .Values.objectStore.seaweedfs.auth.secretKeySecretKey .Values.objectStore.external.secretKeySecretKey .Values.objectStore.enabled }}
            # NFR-11: publishes a job here on submit; ingestion-worker consumes it.
            # Issue #212: publish-only credential -- nats-configmap.yaml's
            # permissions deny this user any subscribe/consume permission.
            - name: NATS_URL
              value: {{ include "nexus-rag.natsUrl" . | quote }}
            - name: NATS_USER
              value: "ingestion_api"
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.credentials.ingestionApi.existingSecret }}
                  key: {{ .Values.nats.credentials.ingestionApi.secretKey }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ingestionApi.resources | nindent 12 }}
      volumes:
        {{- if and .Values.observability.siem.syslogHost (eq .Values.observability.siem.syslogProtocol "tls") }}
        {{- if .Values.observability.siem.tls.caCertSecret }}
        - name: siem-ca
          secret:
            secretName: {{ .Values.observability.siem.tls.caCertSecret }}
        {{- end }}
        {{- if .Values.observability.siem.tls.clientCertSecret }}
        - name: siem-client
          secret:
            secretName: {{ .Values.observability.siem.tls.clientCertSecret }}
        {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
