{{- if .Values.rerankerService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus-rag.fullname" . }}-reranker-service
  labels:
    {{- include "nexus-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: reranker-service
spec:
  # Persistence below is a single ReadWriteOnce PVC -- replicas beyond 1
  # will fail to schedule concurrently unless your storage class supports
  # ReadWriteMany. Fine for this component's default (1); revisit together
  # if you scale it up.
  replicas: {{ .Values.rerankerService.replicas }}
  selector:
    matchLabels:
      {{- include "nexus-rag.componentSelectorLabels" (dict "root" . "component" "reranker-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-rag.labels" . | nindent 8 }}
        app.kubernetes.io/component: reranker-service
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "nexus-rag.podSecurityContext" . | nindent 8 }}
      containers:
        - name: reranker-service
          image: {{ include "nexus-rag.image" (dict "global" .Values.global "image" .Values.rerankerService.image) }}
          securityContext:
            {{- include "nexus-rag.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8003
          env:
            # #73: log verbosity, matching the other custom services.
            - name: LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
            {{- if .Values.observability.tracing.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.tracing.otlpEndpoint | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.observability.tracing.samplerRatio | quote }}
            {{- end }}
            - name: RERANKER_MODEL
              value: {{ .Values.rerankerService.model | quote }}
            {{- if .Values.rerankerService.sharedSecret.existingSecret }}
            - name: RERANKER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rerankerService.sharedSecret.existingSecret }}
                  key: {{ .Values.rerankerService.sharedSecret.secretKey }}
            {{- end }}
          volumeMounts:
            - name: hf-cache
              mountPath: /srv/.cache/huggingface
            # sentence-transformers/torch scratch files (e.g. joblib,
            # matplotlib config); needed alongside readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.rerankerService.resources | nindent 12 }}
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: {{ include "nexus-rag.fullname" . }}-reranker-service-cache
        - name: tmp
          emptyDir: {}
{{- end }}
