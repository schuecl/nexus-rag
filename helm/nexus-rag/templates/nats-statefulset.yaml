{{- if .Values.nats.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nexus-rag.fullname" . }}-nats
  labels:
    {{- include "nexus-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  # Single-node config, same reasoning as qdrant-statefulset.yaml -- NATS
  # clustering (multi-node consensus for JetStream) isn't set up here;
  # REQUIREMENTS.md doesn't call for it, and it's meaningfully more
  # operational complexity than this chart takes on. Revisit if ingestion
  # volume/throughput ever actually needs it.
  serviceName: {{ include "nexus-rag.fullname" . }}-nats
  replicas: {{ .Values.nats.replicas }}
  selector:
    matchLabels:
      {{- include "nexus-rag.componentSelectorLabels" (dict "root" . "component" "nats") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-rag.labels" . | nindent 8 }}
        app.kubernetes.io/component: nats
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nats
          image: {{ include "nexus-rag.image" (dict "global" .Values.global "image" .Values.nats.image) }}
          # -js: JetStream (NFR-11's ack/redelivery semantics). -sd:
          # persist stream data to the mounted volume. -m: monitoring HTTP
          # endpoint (unauthenticated by design, used by the probes below),
          # separate from the client protocol port that the mounted config's
          # per-user permissions protect. Issue #212: a single shared --auth
          # token let either service publish and consume everything on the
          # client port; -c nats.conf gives ingestion-api and
          # ingestion-worker their own publish-only/consume-only credential
          # instead (see nats-configmap.yaml).
          args:
            - "-js"
            - "-sd"
            - "/data"
            - "-m"
            - {{ .Values.nats.service.monitorPort | quote }}
            - "-c"
            - "/etc/nats/nats.conf"
          env:
            # NFR-11/#212: two credentials, not one -- pre-created Secrets,
            # same existingSecret pattern as externalPostgres/externalKeycloak.
            # nats.conf's authorization block is what actually restricts each
            # user to its own subjects; these env vars are just what it
            # substitutes into the $VAR password references.
            - name: NATS_INGESTION_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.credentials.ingestionApi.existingSecret }}
                  key: {{ .Values.nats.credentials.ingestionApi.secretKey }}
            - name: NATS_INGESTION_WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.credentials.ingestionWorker.existingSecret }}
                  key: {{ .Values.nats.credentials.ingestionWorker.secretKey }}
          ports:
            - name: client
              containerPort: {{ .Values.nats.service.clientPort }}
            - name: monitor
              containerPort: {{ .Values.nats.service.monitorPort }}
          volumeMounts:
            - name: storage
              mountPath: /data
            - name: nats-conf
              mountPath: /etc/nats
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
      volumes:
        - name: nats-conf
          configMap:
            name: {{ include "nexus-rag.fullname" . }}-nats-conf
  volumeClaimTemplates:
    - metadata:
        name: storage
        labels:
          {{- include "nexus-rag.labels" . | nindent 10 }}
          app.kubernetes.io/component: nats
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.nats.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.nats.persistence.size }}
{{- end }}
