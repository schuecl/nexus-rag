# Default values for nexus-rag.
#
# Scope (NFR-10): this chart deploys only the *new* components this project
# adds -- ingestion-api, ingestion-worker, orchestration-mcp, reranker-service,
# a dedicated embedding-serving Ollama instance, Qdrant, and NATS (JetStream,
# NFR-11's durable ingestion queue). It assumes LibreChat, LiteLLM, Keycloak,
# and the cluster's existing generation-serving vLLM/Ollama (C7) are already
# deployed and managed separately, and integrates with them via the config
# below rather than deploying or bundling them. Issue #404: the object store
# (NFR-12) can now optionally be added to that self-deployed list too --
# objectStore.enabled: true bundles a SeaweedFS S3 gateway; false (default)
# keeps the original connect-to-existing-S3-only behavior.
#
# Assumption called out explicitly (REQUIREMENTS.md doesn't name Postgres
# among NFR-10's scoped components, unlike Qdrant): a Postgres instance is
# also treated as existing cluster infrastructure this chart connects to,
# not something it deploys. Keycloak is the same, and unlike the object
# store, #404 declined to change that -- both need their own backup/HA/
# accreditation posture well beyond what this chart's single-node
# StatefulSet pattern provides. If that's wrong for your environment, this
# is the section to revisit first.

global:
  # Air-gapped registry (NFR-1) every image below is mirrored into. Prefixed
  # onto each component's image.repository unless that component sets its
  # own fully-qualified repository.
  imageRegistry: "registry.internal.example.mil/nexus-rag"
  imagePullSecrets: []
  # Standard labels applied to every resource this chart creates.
  labels: {}

# ---------------------------------------------------------------------------
# Observability (#73)
# ---------------------------------------------------------------------------

observability:
  # Process-log verbosity/format for every custom service
  # (DEBUG|INFO|WARNING|ERROR|CRITICAL, and text|json).
  logLevel: INFO
  logFormat: text
  # #134: distributed tracing. Disabled while otlpEndpoint is empty; point it
  # at the environment's OTLP/HTTP collector (otel-collector, Tempo, ...).
  # samplerRatio is head sampling 0..1 -- keep it low in production (the
  # retrieval path is latency-sensitive and NFR-4 has no budget yet);
  # ParentBased propagation means one decision covers a whole request tree.
  tracing:
    otlpEndpoint: ""
    samplerRatio: "0.05"
  # #133: let the cluster's existing Prometheus Operator discover the
  # /metrics endpoints ingestion-api, orchestration-mcp, and reranker-service
  # expose. Off by default and deliberately so -- the chart does not ship a
  # monitoring stack (a DoD cluster already runs one inside the accreditation
  # boundary), and rendering a ServiceMonitor where the operator's CRDs are
  # absent fails the install on an unknown kind.
  #
  # Enabling this is not sufficient on its own: the chart's NetworkPolicies
  # deny by default, so the monitoring namespace also needs allowing through.
  serviceMonitor:
    enabled: false
    # Leave empty to create the ServiceMonitors alongside the release. Set it
    # when the operator only watches a specific namespace.
    namespace: ""
    # Extra labels the operator's serviceMonitorSelector matches on -- most
    # installs require one (commonly `release: <prometheus-release>`).
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
  # NFR-2: forward every audit event as RFC 5424 syslog to the environment's
  # existing SIEM collector. Leave syslogHost empty to disable the export.
  # In-cluster this is typically a syslog forwarder Service/sidecar the
  # platform already runs; point it wherever the accreditation boundary's
  # collector listens.
  siem:
    syslogHost: ""
    # 6514 is the RFC 5425 convention when syslogProtocol is tls.
    syslogPort: 514
    # udp | tcp | tls. tls is RFC 5425: octet-counted syslog inside a
    # verified TLS session -- the transport for a collector on a protected
    # segment reached across the cluster boundary.
    syslogProtocol: udp
    # RFC 5424 facility number (0..23). 13 = "log audit", the facility
    # defined for this kind of record; override for collectors that route by
    # a localN slot (16..23) instead.
    facility: 13
    tls:
      # Secret carrying the CA bundle that signed the collector's
      # certificate, under the key ca.crt. Mounted read-only and passed as
      # SIEM_SYSLOG_CA_CERT. Empty = the container's system trust store.
      caCertSecret: ""
      # Optional mutual TLS: a kubernetes.io/tls secret (tls.crt/tls.key)
      # presented to collectors that require client authentication.
      clientCertSecret: ""
      # false disables server-certificate verification. Debug only; the
      # exporter logs a loud warning when this is off.
      verify: true

# ---------------------------------------------------------------------------
# External dependencies (not deployed by this chart)
# ---------------------------------------------------------------------------

externalPostgres:
  # Pre-created Secret containing the full SQLAlchemy DATABASE_URL
  # (postgresql+psycopg://user:pass@host:5432/dbname) under secretKey.
  # Created out-of-band by your cluster's secrets process, not by this chart.
  # NFR-6 (encryption at rest): since Postgres is external to this chart,
  # its storage encryption is entirely your existing Postgres deployment's
  # responsibility -- not something a DATABASE_URL or Secret reference can
  # configure from here. See helm/nexus-rag/README.md's "Encryption at rest"
  # section.
  existingSecret: "nexus-rag-db"
  secretKey: "database-url"
  # Issue #278 (gap G2): one DATABASE_URL per service, each with its own
  # Postgres role, instead of all three sharing one credential that held ALL
  # PRIVILEGES on the whole database. Any holder of that one credential could
  # read audit_log, every document's metadata, oauth_states, and user_sessions
  # (whose OIDC tokens sit in plaintext, #213) -- and a compromise of the
  # retrieval path also yielded write access to tables it never touches.
  #
  # These override secretKey above per service. Each key must hold a full
  # SQLAlchemy URL for that service's own role. Point all three at the same
  # key to keep the old shared-credential behaviour, but that is the thing
  # this issue exists to remove.
  #
  # The grants themselves are applied by whoever administers your external
  # Postgres -- this chart deploys no database, so it cannot apply them.
  # infra/postgres/apply-service-grants.sh is the reference: it carries the
  # exact matrix, and Compose runs it as the lock-down-db-grants one-shot.
  # Notably, nothing gets SELECT on audit_log -- reading the trail is a
  # deliberate DBA/SIEM act (NFR-2), not something an application role can do.
  #
  # Issue #314: once these grants have been applied, per-service roles lose
  # table ownership and can no longer run the ALTER TABLE ADD COLUMN that
  # common/db.py's additive-column back-fill (_ADDITIVE_COLUMNS) needs on a
  # later release -- there is no separate grantable "add a column" privilege
  # in Postgres, only ownership. Compose's fix is the migrate-db-schema
  # one-shot (runs init_db() as the bootstrap superuser before the app
  # services start); against an external Postgres, your own migration step
  # has to do the same thing -- run `python -c "from common.db import
  # init_db; init_db()"` (or the equivalent ALTER TABLE statements from
  # _ADDITIVE_COLUMNS) as a role that owns the tables, before rolling out a
  # release that added a new entry there, same as any other schema change.
  # Seconds after which a pooled connection is retired and reopened. #236 set
  # pool_recycle=1800 on the shared engine, but that number is a guess about
  # *other* systems -- PgBouncer's server_idle_timeout, a cloud proxy or LB idle
  # limit, idle_session_timeout -- and this chart connects to a Postgres it does
  # not deploy, behind whatever intermediary your environment provides. Lower it
  # to sit below that intermediary's idle timeout; -1 disables recycling.
  #
  # Not a correctness setting: pool_pre_ping already replaces a dead connection
  # at checkout, so a mismatched value costs round trips, not errors. An
  # unparseable value falls back to 1800 with a warning rather than failing the
  # pod's startup.
  poolRecycleSeconds: 1800
  perServiceKeys:
    # Empty = fall back to secretKey above, i.e. the pre-#278 shared
    # credential. Set all three once your Postgres has the roles.
    ingestionApi: ""
    ingestionWorker: ""
    orchestrationMcp: ""

externalKeycloak:
  # Passed through as OIDC_ISSUERS (common/claims.py accepts a comma-separated
  # list there, for the dev Compose stack's two-hostnames-one-Keycloak problem --
  # see that file's comment). Production has one real Keycloak behind one
  # canonical hostname, so a single value here is all that's ever needed.
  issuerUrl: "https://keycloak.example.mil/realms/nexus-rag"
  audience: "rag-app"
  # Browser OIDC Authorization Code + PKCE login for the ingestion UI
  # (ARCHITECTURE.md Section 4.4). clientId matches the confidential client
  # already configured per REQUIREMENTS.md Section 6.2 (dev stack: rag-app,
  # infra/keycloak/realm-export/nexus-rag-realm.json).
  clientId: "rag-app"
  # rag-app is a confidential client -- its secret comes from a pre-created
  # Secret (same pattern as externalPostgres.existingSecret above), never a
  # plain value here. The Secret must contain a key matching secretKey below.
  clientSecret:
    existingSecret: "nexus-rag-keycloak-client-secret"
    secretKey: "client-secret"

objectStore:
  # NFR-12: durable storage for original uploaded files, independent of
  # Qdrant/Postgres (common/object_store.py). Only the S3-compatible backend
  # is meaningful here -- the filesystem backend (common/object_store.py's
  # FilesystemObjectStore) is dev-Compose-only, since it assumes a single
  # shared filesystem across every reader/writer, which doesn't hold once
  # ingestion-api and ingestion-worker are separate pods.
  #
  # Issue #404: either this chart deploys a bundled SeaweedFS S3 gateway
  # (enabled: true, seaweedfs.* below) or it connects to an already-existing
  # S3-compatible endpoint (enabled: false + external.* below -- an existing
  # enterprise S3, Ceph RGW, or another validated S3-compatible platform;
  # this was the chart's only option before #404). Same either/or pattern as
  # qdrant/milvus/nats/embeddingService, but the default is false, not true:
  # unlike those (self-deploy was already their pre-#401 behavior), external
  # was this chart's only object-store behavior before #404 existed, and an
  # upgrade must not silently start deploying a new StatefulSet + PVC that
  # wasn't there before without an explicit opt-in.
  enabled: false
  external:
    endpoint: "https://s3.example.mil"
    bucket: "nexus-rag-documents"
    region: "us-gov-west-1"
    # Pre-created Secret (out-of-band, same pattern as externalPostgres
    # above) containing both keys named below.
    existingSecret: "nexus-rag-object-store"
    accessKeySecretKey: "access-key"
    secretKeySecretKey: "secret-key"
  seaweedfs:
    image:
      repository: chrislusf/seaweedfs
      # NFR-16: pinned to a specific, recent release -- never :latest.
      tag: "4.40"
    replicas: 1
    # Bucket this chart pre-creates (templates/seaweedfs-bucket-init-job.yaml)
    # against the self-deployed instance -- unlike external mode, nothing else
    # ever creates it, and common/object_store.py's S3Client never calls
    # create_bucket itself (it assumes the bucket already exists, same as a
    # real external S3 would require).
    bucket: "nexus-rag-documents"
    # SeaweedFS's S3 gateway isn't actually region-sharded -- this is
    # cosmetic, reported to the AWS SDK because boto3 requires some value.
    region: "us-gov-west-1"
    # Access/secret key pair minted into SeaweedFS's own S3 identity config
    # at pod startup (templates/seaweedfs-statefulset.yaml's init container
    # renders it from these two keys) *and* handed to ingestion-api/
    # ingestion-worker as OBJECT_STORE_S3_ACCESS_KEY/_SECRET_KEY -- same
    # Secret, same keys, so the credential SeaweedFS enforces and the one the
    # app presents can never drift apart. Pre-created, same existingSecret
    # pattern as qdrant.apiKey.
    auth:
      existingSecret: "nexus-rag-seaweedfs-keys"
      accessKeySecretKey: "access-key"
      secretKeySecretKey: "secret-key"
    service:
      s3Port: 8333
      masterPort: 9333
      volumePort: 8080
      filerPort: 8888
    persistence:
      size: 100Gi
      # NFR-6: see qdrant.persistence.storageClassName's comment below --
      # same applies here.
      storageClassName: ""
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "2Gi"

# ---------------------------------------------------------------------------
# Qdrant (C3 -- already decided; new to the cluster, so this chart deploys it
# directly rather than depending on an external Helm chart repo, which would
# need its own air-gapped mirroring step)
# ---------------------------------------------------------------------------

# #160: either/or vector backend. "qdrant" (default) keeps today's path
# byte-for-byte; "milvus" points every service at the Milvus StatefulSet
# below instead. One backend per deployment -- never both.
vectorBackend: qdrant

qdrant:
  # Either this chart deploys Qdrant (enabled: true, default) or it connects
  # to an already-running Qdrant cluster (enabled: false + external.host
  # below) -- never both, mirroring the either/or relationship between
  # qdrant and milvus above at the vectorBackend level. Ignored entirely
  # when vectorBackend is "milvus".
  enabled: true
  # Only read when enabled is false. qdrant.apiKey below still applies in
  # external mode -- point it at a Secret holding the *existing* cluster's
  # API keys rather than one this chart generates credentials for.
  external:
    host: ""
    httpPort: 6333
    # true selects https:// for the URL built from host/httpPort above.
    tls: false
  image:
    repository: qdrant/qdrant
    # NFR-16: pinned to a specific, recent release -- never :latest.
    tag: "v1.18.2"
  replicas: 1
  # NFR-15: Qdrant must require authenticated access -- pre-created Secret
  # (out-of-band, same existingSecret pattern as externalPostgres/
  # externalKeycloak) with two keys: a full read/write key (ingestion-worker,
  # which creates the collection and writes new points; ingestion-api also
  # holds it to update/delete points on approve/reject/supersede) and a
  # read-only key (orchestration-mcp, which only ever queries). One Secret,
  # two keys, rather than two Secrets, since they're issued and rotated
  # together.
  apiKey:
    existingSecret: "nexus-rag-qdrant-keys"
    secretKey: "api-key"
    readOnlySecretKey: "read-only-api-key"
  service:
    httpPort: 6333
    grpcPort: 6334
  persistence:
    size: 50Gi
    # NFR-6 (encryption at rest): set this to a StorageClass backed by
    # encrypted volumes -- disk/volume encryption is a StorageClass-level
    # (or underlying block-storage-level) property, not something this
    # chart or Qdrant itself can turn on. Empty string uses the cluster's
    # default StorageClass as-is, whatever that provides. See
    # helm/nexus-rag/README.md's "Encryption at rest" section.
    storageClassName: ""
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# ---------------------------------------------------------------------------
# NATS JetStream (NFR-11 -- durable ingestion job queue, common/job_queue.py).
# New to the cluster, hand-deployed here for the same reason as qdrant above:
# avoids depending on an external Helm chart repo, which would need its own
# air-gapped mirroring step.
# ---------------------------------------------------------------------------

# #160: rendered only when vectorBackend is "milvus". Standalone with
# embedded etcd and local storage -- the single-node evaluation deployment,
# matching the chart's single-node Qdrant posture.
milvus:
  # Same either/or self-deploy-vs-external pattern as qdrant.enabled above.
  # Ignored entirely when vectorBackend is "qdrant".
  enabled: true
  # Only read when enabled is false.
  external:
    host: ""
    port: 19530
    # true selects https:// for the URL built from host/port above.
    tls: false
  image:
    repository: milvusdb/milvus
    # NFR-16: pinned to a specific, recent release -- never :latest.
    tag: "v2.4.17"
  replicas: 1
  service:
    port: 19530
  # NFR-15: authenticated access required. Pre-created Secret carrying one
  # key whose value is the "user:password" token the services present
  # (Milvus bootstrap credentials are root:Milvus; change them and this
  # Secret together). Still applies in external mode -- point it at a Secret
  # holding the existing cluster's token.
  auth:
    existingSecret: ""
    secretKey: token
  persistence:
    size: 16Gi
    storageClassName: ""
  resources: {}

nats:
  # Either this chart deploys NATS (enabled: true, default) or it connects
  # to an already-running JetStream cluster (enabled: false + external.host
  # below).
  enabled: true
  # Only read when enabled is false. nats.credentials below still applies in
  # external mode -- ingestion-api/ingestion-worker still authenticate as
  # their own restricted user, provisioned out-of-band on the existing
  # cluster the same way nats-configmap.yaml provisions it here.
  external:
    host: ""
    port: 4222
    # true selects tls:// for the URL built from host/port above.
    tls: false
  image:
    repository: nats
    tag: "2.14.3-alpine"
  replicas: 1
  service:
    clientPort: 4222
    monitorPort: 8222
  persistence:
    size: 10Gi
    # NFR-6: see qdrant.persistence.storageClassName's comment above -- same
    # applies here.
    storageClassName: ""
  # Issue #212: two credentials, not one shared token -- ingestion-api
  # (publish-only) and ingestion-worker (consume-only) each authenticate as
  # their own NATS user, restricted by templates/nats-configmap.yaml's
  # per-subject permissions. Pre-created Secrets, same existingSecret
  # pattern as externalPostgres/externalKeycloak.
  credentials:
    ingestionApi:
      existingSecret: "nexus-rag-nats-ingestion-api"
      secretKey: "password"
    ingestionWorker:
      existingSecret: "nexus-rag-nats-ingestion-worker"
      secretKey: "password"
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# ---------------------------------------------------------------------------
# Dedicated embedding-serving Ollama (NFR-8: a separate GPU allocation from
# the cluster's existing generation-serving vLLM/Ollama, not the same
# deployment as C7's chat-generation instance)
# ---------------------------------------------------------------------------

embeddingService:
  # Either this chart deploys a dedicated embedding-serving Ollama instance
  # (enabled: true, default) or it connects to an already-running instance
  # elsewhere (enabled: false + external.host below). Note this instance
  # also serves ingestionWorker.visionModel/classificationModel/piiLlmModel
  # when those are set -- an external endpoint must have every model this
  # deployment uses provisioned on it, not just embeddingService.model.
  enabled: true
  # Only read when enabled is false.
  external:
    host: ""
    port: 11434
    # true selects https:// for the URL built from host/port above.
    tls: false
    # Which wire protocol the endpoint above speaks. "ollama" (default) is
    # Ollama's native /api/embeddings (embeddings) and /api/generate
    # (captioning/classification/PII-LLM, issue #418), unauthenticated --
    # what the self-deployed instance (enabled: true) always speaks too, and
    # what any Ollama-*compatible* external endpoint speaks. "openai"
    # targets an OpenAI-API-compliant hosted model (vLLM, TGI, a cloud
    # provider) via /v1/embeddings and /v1/chat/completions, authenticated
    # with apiKey below. One switch for both wire protocols since they're
    # always the same physical endpoint (see the comment above) -- see
    # templates/ingestion-worker-deployment.yaml's EMBEDDING_API_COMPATIBILITY/
    # COMPLETION_API_COMPATIBILITY, both sourced from this one field.
    apiCompatibility: ollama
    # Only meaningful (and only sent as an Authorization: Bearer header) when
    # apiCompatibility is "openai" and existingSecret is set -- Ollama's
    # native path takes no credential, same as today.
    apiKey:
      existingSecret: ""
      secretKey: "api-key"
  image:
    repository: ollama/ollama
    # NFR-16: pinned, never :latest.
    tag: "0.32.1"
  model: "nomic-embed-text"
  replicas: 1
  service:
    port: 11434
  persistence:
    size: 20Gi
    # NFR-6: see qdrant.persistence.storageClassName's comment above -- same
    # applies here.
    storageClassName: ""
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "2"
      memory: "8Gi"
      nvidia.com/gpu: "1"

# ---------------------------------------------------------------------------
# reranker-service (FR-25)
# ---------------------------------------------------------------------------

rerankerService:
  # Either this chart deploys a dedicated reranker-service instance (enabled:
  # true, default) or it connects to an already-running cross-encoder/rerank
  # endpoint elsewhere (enabled: false + external.host below) -- same
  # enabled/external choice as embeddingService, issue #419.
  enabled: true
  # Only read when enabled is false.
  external:
    host: ""
    port: 8080
    # true selects https:// for the URL built from host/port above.
    tls: false
    # Which wire protocol the endpoint above speaks. "internal" (default) is
    # this chart's own reranker-service shape (POST {query, chunks: [{id,
    # text}]} -> [{id, score}]) -- what the self-deployed instance (enabled:
    # true) always speaks, and what any reranker-service-*compatible*
    # external endpoint speaks. Two genuinely external shapes, decided in
    # issue #419:
    #   "tei"    -- HuggingFace text-embeddings-inference's native /rerank:
    #               POST {query, texts: [...]}  -> [{index, score}, ...].
    #               Recommended default for a real external endpoint: this is
    #               what this project's own reranker-service conceptually is
    #               (a hosted cross-encoder), and the most likely thing
    #               already running in an air-gapped enclave.
    #   "cohere" -- the Jina/Cohere-style /v1/rerank convention: POST
    #               {model, query, documents: [...], top_n} -> {results:
    #               [{index, relevance_score}, ...]}. Also what vLLM's own
    #               /rerank, /v1/rerank, /v2/rerank speak (vLLM does NOT
    #               speak the "tei" shape above despite hosting cross-encoder
    #               rerankers too) -- set this when pointing at a vLLM
    #               instance rather than a TEI one. `model` is sent from
    #               rerankerService.model, same field the self-deployed
    #               image loads.
    apiCompatibility: internal
    # Only meaningful (and only sent as an Authorization: Bearer header) when
    # apiCompatibility is "tei" or "cohere" and existingSecret is set --
    # reranker-service's own native path takes rerankerService.sharedSecret
    # instead (unaffected by this block).
    apiKey:
      existingSecret: ""
      secretKey: "api-key"
  image:
    repository: reranker-service
    # NFR-16: matches Chart.yaml's appVersion, not :latest. Since #295 this
    # is backed by a real image: release.yml publishes it on every vX.Y.Z
    # tag, and the release PR bumps this together with appVersion --
    # scripts/check_version_consistency.py fails CI if they disagree.
    tag: "0.5.0"
  # Also the model name sent to an external endpoint in "cohere" mode's
  # request body (vLLM/Cohere-style rerank requires it); unused in "tei"
  # mode, which doesn't take a model field.
  model: "cross-encoder/ms-marco-MiniLM-L6-v2"
  replicas: 1
  # Issue #216: /rerank has no authorization model of its own -- reachability
  # is authorization, and that's only as strong as the NetworkPolicy above it
  # (inert on a CNI that doesn't enforce policy). Empty by default so the
  # chart still renders and runs unauthenticated as before -- same posture as
  # today, but the reranker-service pod logs a startup warning when this is
  # unset, so leaving it empty is a visible choice rather than a silent one.
  # Set to a pre-created Secret (same existingSecret pattern as
  # qdrant.apiKey) to require it: orchestration-mcp reads the same key to
  # send the header, reranker-service reads it to check the header.
  sharedSecret:
    existingSecret: ""
    secretKey: "shared-secret"
    # Issue #281 gap G5 stage 2: set only while rotating the value above --
    # reranker-service accepts either the current or this previous value, so
    # it and orchestration-mcp don't have to switch in the same instant.
    # orchestration-mcp itself never reads this; it only ever sends the
    # current value. Unset (default) outside a rotation window. See
    # docs/credential-rotation.md.
    previousExistingSecret: ""
    previousSecretKey: "shared-secret-previous"
  service:
    port: 8003
  persistence:
    size: 5Gi
    # NFR-6: see qdrant.persistence.storageClassName's comment above -- same
    # applies here.
    storageClassName: ""
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# ---------------------------------------------------------------------------
# ingestion-api (FR-1..FR-9, FR-10..FR-16)
# ---------------------------------------------------------------------------

ingestionApi:
  enabled: true
  image:
    repository: ingestion-api
    # NFR-16: see rerankerService.image.tag's comment -- published by
    # release.yml, kept in lockstep by check_version_consistency.py (#295).
    tag: "0.5.0"
  replicas: 2
  # FR-9/NFR-7: upload size guard in bytes.
  maxUploadBytes: 52428800
  # FR-34/issue #356: batch-submission file-count cap (POST /documents/batch).
  # A batch's aggregate request body can be as large as
  # maxBatchFiles x maxUploadBytes; the ingress template computes that
  # product and injects it as the proxy-body-size annotation default.
  maxBatchFiles: 25
  service:
    type: ClusterIP
    port: 8001
  ingress:
    enabled: false
    className: ""
    host: "rag-ingest.example.mil"
    tls: []
    # Issue #107: the only layer that bounds what an oversized upload costs
    # *before* it reaches a Python process. ingestion-api's own
    # MAX_UPLOAD_BYTES check (app/routes/upload.py) can only run after
    # Starlette has already consumed and spooled the whole request body, so
    # it bounds that service's memory, not bytes transferred or written to
    # disk.
    #
    # nginx.ingress.kubernetes.io/proxy-body-size is deliberately *not* set
    # here as a static value -- POST /documents/batch (FR-34/#356) sends
    # every file in a batch as one multipart request, so the aggregate body
    # can be as large as maxBatchFiles x maxUploadBytes, not just
    # maxUploadBytes. The ingress template computes that product and injects
    # it as the default; set it explicitly in this map only to override that
    # computed value for your environment (e.g. a different ingress
    # controller needs its own annotation key). See
    # templates/ingestion-api-ingress.yaml.
    annotations: {}
  # Browser OIDC login callback URL (ARCHITECTURE.md Section 4.4), passed
  # through as OIDC_REDIRECT_URI. Empty (default) derives it from
  # ingress.host above -- https if ingress.tls is set, http otherwise (see
  # _helpers.tpl's nexus-rag.oidcRedirectUri). Set this explicitly only if
  # ingress is disabled, or the externally-visible URL differs from the
  # ingress host (e.g. behind another proxy/load balancer this chart doesn't
  # manage).
  oidcRedirectUri: ""
  # Always true for any real (https) deployment -- a Secure-flagged cookie
  # never comes back over plain http. Compose's dev stack is the only place
  # this should ever be false (docker-compose.yml sets COOKIE_SECURE=false
  # there, since it serves the UI over http://localhost).
  cookieSecure: true
  # Issue #279 (gap G3): true is the production default -- a lone rag-purge
  # holder can no longer destroy a document with one call; a second,
  # different holder must confirm via POST /documents/{id}/purge-request/
  # {request_id}/confirm. docker-compose.yml sets this false for the dev
  # loop (see that file's comment) since it only ever seeds one rag-purge
  # holder.
  purgeTwoPersonRequired: true
  # How long an unconfirmed purge request stays confirmable before it must
  # be re-requested.
  purgeRequestExpiryHours: 24
  # Issue #213: encrypts UserSession's stored access/refresh/id tokens at
  # rest (common/token_crypto.py) -- pre-created Secret, same existingSecret
  # pattern as externalKeycloak.clientSecret. Must be a Fernet key (32
  # url-safe base64-encoded bytes); see .env.example for how to generate one.
  sessionTokenEncryption:
    existingSecret: "nexus-rag-session-token-key"
    secretKey: "key"
    # Issue #281 gap G5 stage 2: set only while rotating the key above --
    # common/token_crypto.py tries this via MultiFernet if the current key
    # fails to decrypt a row, so sessions written under the old key keep
    # working until it's retired. Unset (default) outside a rotation
    # window. See docs/credential-rotation.md.
    previousExistingSecret: ""
    previousSecretKey: "key-previous"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# ---------------------------------------------------------------------------
# orchestration-mcp (FR-24..FR-29) -- registered with LibreChat as an MCP
# server out-of-band (LibreChat's own config, not this chart); this only
# deploys the service LibreChat's OBO-authenticated calls reach.
# ---------------------------------------------------------------------------

orchestrationMcp:
  enabled: true
  image:
    repository: orchestration-mcp
    # NFR-16: see rerankerService.image.tag's comment -- published by
    # release.yml, kept in lockstep by check_version_consistency.py (#295).
    tag: "0.5.0"
  replicas: 2
  service:
    type: ClusterIP
    port: 8002
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  # issue #89: optional {content_type: multiplier} JSON map applied to
  # cross-encoder scores during reranking, e.g. '{"table": 1.15}'. Empty
  # string (the default) means no boost -- every content type weighted 1.0.
  contentTypeBoosts: ""

# ---------------------------------------------------------------------------
# ingestion-worker (FR-3..FR-6, NFR-11) -- the durable JetStream consumer
# that does the actual parse/chunk/embed/store pipeline, moved out of
# ingestion-api's request path.
# ---------------------------------------------------------------------------

ingestionWorker:
  enabled: true
  image:
    repository: ingestion-worker
    # NFR-16: see rerankerService.image.tag's comment -- published by
    # release.yml, kept in lockstep by check_version_consistency.py (#295).
    tag: "0.5.0"
  replicas: 2
  # FR-4: chunking target size (words) and overlap ratio -- Section 2's
  # starting point.
  chunkTargetWords: 512
  chunkOverlapRatio: 0.15
  # Issue #396: chunks embedded per request -- one bounded batch call instead
  # of one request per chunk. Larger batches cut round trips but raise the
  # embedding server's per-request memory. An unparseable or < 1 value logs a
  # warning and falls back to 32 rather than failing the pod's startup.
  embeddingBatchSize: 32
  # Issue #92: vision model for image/figure captioning at ingestion, served
  # by the same Ollama instance as embeddings (embeddingService). Empty
  # disables captioning entirely (no env var injected, no VLM calls). The
  # model must be provisioned on that Ollama instance separately -- this
  # chart's embedding-service init only pulls embeddingService.model.
  visionModel: ""
  # Issue #308: model for LLM zero-shot classification suggestion at
  # ingestion, served by the same Ollama instance as embeddings/captioning.
  # Empty disables the feature entirely (no env var injected, no extra LLM
  # calls). Must be provisioned on that Ollama instance separately, same
  # caveat as visionModel above.
  classificationModel: ""
  # Issue #343 (Phase 2 of #342): model for the LLM-assisted PII/
  # sensitive-info advisory pass at ingestion, served by the same Ollama
  # instance as embeddings/captioning/classification. Empty disables the
  # feature entirely (no env var injected, no extra LLM calls). Must be
  # provisioned on that Ollama instance separately, same caveat as
  # visionModel/classificationModel above.
  piiLlmModel: ""
  service:
    port: 8004
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

# Issue #110: default-deny ingress for this chart's data-plane components.
#
# Why it matters here specifically: orchestration-mcp is the only place FR-26
# is enforced. Qdrant applies whatever filter it is handed and has no notion of
# clearance, and the chunk payload holds the source text in cleartext -- so
# anything that can reach Qdrant reads the whole corpus at every classification
# level. reranker-service is worse: it takes no credential at all and receives
# full chunk text, so reachability *is* authorization for it today.
networkPolicy:
  # Enabled by default: failing safe matters more than convenience here. Note
  # that a NetworkPolicy is inert unless the cluster's CNI enforces it (Calico,
  # Cilium, Antrea do; some managed CNIs silently do not) -- worth verifying
  # rather than assuming, since Kubernetes reports no error either way.
  enabled: true

  # Who may reach ingestion-api. Empty means *nothing* may, which will make the
  # UI unreachable -- set this to whatever identifies your ingress controller.
  # Left empty rather than guessed because the right selector is
  # cluster-specific, and a wrong-but-plausible default would silently grant
  # access to the wrong namespace.
  #
  # Typical (ingress-nginx in its own namespace):
  #   ingressControllerSelectors:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: ingress-nginx
  ingressControllerSelectors: []

  # Who may call orchestration-mcp's MCP endpoint. LibreChat is part of the
  # existing MPNexus stack rather than this chart, so it cannot be selected by
  # this chart's own labels. ingestion-api's /search/query proxy is allowed
  # unconditionally; everything else goes here.
  #
  #   mcpClients:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: librechat
  #       podSelector:
  #         matchLabels:
  #           app: librechat
  mcpClients: []

  # Additional NetworkPolicyPeer entries for the backing stores, for callers
  # this chart does not deploy (a migration job, a debug pod, an operator).
  extraQdrantClients: []
  # Same idea, for the Milvus NetworkPolicy (only rendered when vectorBackend
  # is "milvus").
  extraMilvusClients: []
  extraEmbeddingClients: []

  # Opt-in default-deny egress from the four custom services. Off by default
  # because all of them need the *external* Postgres and Keycloak, and two also
  # need the external object store, none of whose addresses this chart knows --
  # turning this on without populating egressAllow will break the deployment.
  # DNS and in-namespace traffic are permitted automatically.
  denyEgressByDefault: false
  # Extra egress rules, appended verbatim. Typically the CIDRs or namespaces of
  # the external Postgres, Keycloak, and object store.
  egressAllow: []
