groups:
  - name: nexus-rag-availability
    rules:
      - alert: NexusRagServiceDown
        expr: up{job=~"nexus-rag-.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nexus RAG service is unavailable"
          description: "{{ $labels.job }} at {{ $labels.instance }} has been down for one minute."

      - alert: NexusRagWorkerConsumerStopped
        expr: nexus_rag_ingestion_worker_consumer_running == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ingestion consumer is not running"
          description: "The HTTP process may still be alive, but its durable JetStream consumer is stopped."

      - alert: NexusRagDependencyDown
        expr: up{job=~"nats|postgres|qdrant|keycloak"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nexus RAG dependency is unavailable"
          description: "{{ $labels.job }} at {{ $labels.instance }} has not been scrapeable for two minutes."

  - name: nexus-rag-ingestion
    rules:
      - alert: NexusRagQueuePublishFailure
        expr: increase(nexus_rag_ingestion_queue_publish_total{outcome="failed"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A document could not be published to JetStream"
          description: "The reconciler will retry, but the Postgres-to-JetStream hand-off is degraded."

      - alert: NexusRagUnpublishedDocumentStale
        expr: nexus_rag_ingestion_queue_oldest_unpublished_seconds > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "A queued document has not reached JetStream"
          description: "The oldest unacknowledged queue publication is {{ $value | humanizeDuration }} old."

      - alert: NexusRagWorkerTransientFailures
        expr: increase(nexus_rag_ingestion_worker_jobs_total{outcome="transient_failure"}[10m]) > 2
        labels:
          severity: warning
        annotations:
          summary: "Ingestion jobs are repeatedly retrying"
          description: "More than two transient worker failures occurred in ten minutes."

      - alert: NexusRagWorkerDeliveryExhausted
        expr: increase(nexus_rag_ingestion_worker_jobs_total{outcome="delivery_exhausted"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "An ingestion job exhausted its retry budget"
          description: "At least one document was marked failed after all JetStream delivery attempts."

  - name: nexus-rag-retrieval
    rules:
      - alert: NexusRagHighQueryLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(nexus_rag_query_stage_seconds_bucket{stage="total"}[10m])
            )
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAG query p95 latency is above five seconds"
          description: "The retrieval and reranking path has exceeded the provisional operational threshold."

      - alert: NexusRagRerankerFallbackHigh
        expr: |
          sum(rate(nexus_rag_reranker_fallback_total[10m]))
            /
          clamp_min(sum(rate(nexus_rag_queries_total[10m])), 0.001)
          > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 10% of queries are bypassing the reranker"
          description: "Results are being served in fused order, which can silently reduce ranking quality."

      - alert: NexusRagQueryDeniedSpike
        expr: increase(nexus_rag_queries_total{outcome="denied"}[10m]) > 20
        labels:
          severity: warning
        annotations:
          summary: "Query authorization denials spiked"
          description: "More than twenty denied retrieval attempts occurred in ten minutes; correlate with SIEM audit events."

  # Issue #426 (#127 gap #4): scripts/detect_query_anomalies.py pushes these
  # via Pushgateway -- see that script's module docstring. Deliberately no
  # identity in either metric: nexus_rag_query_anomaly_flagged_identities is
  # a *count* of identities per signal, not a per-identity series (same
  # cardinality/privacy reasoning as orchestration-mcp/app/metrics.py).
  # Attribution (which actor_sub) lives only in the script's own stdout
  # report and the audit log itself, both already gated to holders of the
  # nexus_rag_audit_reporting credential.
  - name: nexus-rag-security
    rules:
      - alert: NexusRagQueryAnomalyDetected
        expr: max_over_time(nexus_rag_query_anomaly_flagged_identities[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Reconnaissance-shaped query pattern detected"
          description: "At least one identity was flagged by the most recent detect_query_anomalies.py run for signal {{ $labels.signal }}. Run the script directly (or check its last stdout report) to identify the actor_sub -- Prometheus deliberately carries no identity for this metric."

      - alert: NexusRagQueryAnomalyDetectionStale
        expr: time() - nexus_rag_query_anomaly_last_run_timestamp_seconds > 7200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Reconnaissance-pattern detection has not run recently"
          description: "detect_query_anomalies.py has not reported to Pushgateway in over two hours (the default assumes an hourly schedule; adjust this threshold if this deployment runs it less often). A stopped detector is a silent blind spot, not just a missed run."

      - alert: NexusRagTaggingCalibrationStale
        expr: time() - nexus_rag_tagging_calibration_last_run_timestamp_seconds > 691200
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Tagging-advisory calibration has not run recently"
          description: "calibrate_tagging_advisory.py has not reported to Pushgateway in over eight days (the default assumes a weekly schedule; adjust this threshold if this deployment runs it less often). Fires only after at least one run has published -- a deployment that never schedules calibration sees no series and no alert (#527)."

      # Issue #432 (NFR-18 follow-on): app/integrity_sweep.py's periodic
      # re-verification of object-store originals against content_sha256 --
      # same flagged-count/heartbeat pair as the two anomaly-detection rules
      # above, fed by the same Pushgateway mechanism
      # (helm/nexus-rag/templates/ingestion-worker-integrity-sweep-cronjob.yaml).
      - alert: NexusRagIntegrityCheckFailureDetected
        expr: max_over_time(nexus_rag_integrity_check_failures_total[26h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Object-store original failed periodic integrity re-verification"
          description: "The most recent integrity sweep found at least one document whose object-store original no longer matches its stored content_sha256 digest, or could not be read at all -- see the document.integrity_check_failed audit_log entries for which document(s) and why (digest_mismatch vs. original_unreadable). This is the tamper-evidence link NFR-18 describes; treat as a security incident until a curator/admin triages it as bit rot or a backup-restore artifact."

      - alert: NexusRagIntegritySweepStale
        expr: time() - nexus_rag_integrity_check_last_run_timestamp_seconds > 172800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Periodic object-store integrity sweep has not run recently"
          description: "app/integrity_sweep.py has not reported to Pushgateway in over 48 hours (the chart's default CronJob schedule is nightly; adjust this threshold if this deployment runs it less often). A stopped sweep silently returns the corpus to event-triggered-only integrity verification (NFR-18's original, narrower guarantee), not just a missed run."
