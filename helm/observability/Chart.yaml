apiVersion: v2
name: observability
description: >-
  Nexus RAG observability backends (issue #257) -- Prometheus, Loki, Tempo,
  Alertmanager, a batch-metrics Pushgateway, an OTLP collector, a pod-log
  shipper, and the exporters they
  scrape. Deliberately ships NO Grafana: this chart exists for the topology
  where Grafana already runs outside the cluster on the air-gapped network, so
  the four stores it reads are published on LoadBalancer addresses and the
  dashboards are vendored under dashboards/ as importable files. Installed
  separately from the nexus-rag chart, which keeps its own position (NFR-10)
  of deploying no monitoring stack -- a cluster that already has one inside the
  accreditation boundary should use nexus-rag's observability.serviceMonitor
  path instead of this chart.
type: application
version: 0.1.0
appVersion: "0.1.0"
