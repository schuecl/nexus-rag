{{- /*
#257: a Grafana datasource provisioning file, rendered with this install's
LoadBalancer addresses, for the operator to copy into the EXTERNAL Grafana's
provisioning directory. Nothing in the cluster consumes this ConfigMap -- it is
a delivery mechanism for a file that belongs on a different machine:

  kubectl get configmap <release>-grafana-datasources \
    -o jsonpath='{.data.datasources\.yaml}' > datasources.yaml

The UIDs below are NOT free-form. All 13 dashboards in dashboards/ have an
empty templating.list and no __inputs block -- they reference the literal UIDs
`prometheus`, `loki`, `tempo`, `alertmanager`, and `documents-pg`. Change one
here and every panel bound to it imports broken, with no error at import time
and no hint at panel time beyond "No data".
*/}}
{{- if .Values.externalGrafana.emitDatasourcesConfigMap }}
{{- /*
When loadBalancerIP was pre-assigned we can render a working file. When the
provider allocates dynamically the address does not exist at template time, so
emit an obvious placeholder rather than a plausible-looking wrong value -- the
NOTES print the real addresses once the LB has settled.
*/}}
{{- $promAddr := .Values.prometheus.service.loadBalancerIP | default "REPLACE_WITH_PROMETHEUS_LB_ADDRESS" }}
{{- $lokiAddr := .Values.loki.service.loadBalancerIP | default "REPLACE_WITH_LOKI_LB_ADDRESS" }}
{{- $tempoAddr := .Values.tempo.service.loadBalancerIP | default "REPLACE_WITH_TEMPO_LB_ADDRESS" }}
{{- $amAddr := .Values.alertmanager.service.loadBalancerIP | default "REPLACE_WITH_ALERTMANAGER_LB_ADDRESS" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability.fullname" . }}-grafana-datasources
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-external
data:
  datasources.yaml: |
    # Generated by the observability chart (issue #257) for an EXTERNAL,
    # air-gapped Grafana. Drop this in Grafana's
    # provisioning/datasources/ directory and restart it.
    #
    # The uid values are load-bearing -- see helm/observability/README.md.
    apiVersion: 1

    datasources:
      {{- if .Values.prometheus.enabled }}
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ $promAddr }}:{{ .Values.prometheus.service.port }}
        isDefault: true
        editable: false
      {{- end }}
      {{- if .Values.loki.enabled }}
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://{{ $lokiAddr }}:{{ .Values.loki.service.port }}
        editable: false
        jsonData:
          derivedFields:
            # Matches the trace_id field common/logging_setup.py injects into
            # every JSON log record, which is what makes the log -> trace jump
            # work. Requires LOG_FORMAT=json on the nexus-rag side; with the
            # default text format there is no trace_id to match and the link
            # simply never appears.
            - name: TraceID
              matcherRegex: '"trace_id":"([0-9a-f]{32})"'
              datasourceUid: tempo
              url: "$${__value.raw}"
      {{- end }}
      {{- if .Values.tempo.enabled }}
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://{{ $tempoAddr }}:{{ .Values.tempo.service.port }}
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            tags: ["service.name"]
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            tags:
              - key: service.name
                value: job
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
      {{- end }}
      {{- if .Values.alertmanager.enabled }}
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        access: proxy
        url: http://{{ $amAddr }}:{{ .Values.alertmanager.service.port }}
        editable: false
        jsonData:
          implementation: prometheus
      {{- end }}
      {{- if .Values.externalGrafana.documentsDatasource.enabled }}
      # #133: metadata-only Postgres datasource for the Documents dashboard.
      # This one does NOT go through anything this chart deploys -- external
      # Grafana connects straight to Postgres. It requires:
      #   1. a network path from Grafana to the database,
      #   2. infra/postgres/document-metrics-view.sql already applied,
      #   3. the grafana_ro role granted SELECT on document_metrics.
      # None of those are things this chart can do for you.
      - name: Documents (Postgres)
        uid: documents-pg
        type: postgres
        access: proxy
        url: {{ .Values.externalGrafana.documentsDatasource.host | default "REPLACE_WITH_POSTGRES_HOST" }}:{{ .Values.externalGrafana.documentsDatasource.port }}
        database: {{ .Values.externalGrafana.documentsDatasource.database }}
        user: {{ .Values.externalGrafana.documentsDatasource.user }}
        secureJsonData:
          # Supply via Grafana's own env substitution -- deliberately not
          # rendered into this ConfigMap, which is world-readable to anything
          # with get on ConfigMaps in this namespace.
          password: ${GRAFANA_DB_PASSWORD}
        jsonData:
          # Grafana 11+ reads the database from jsonData.database; the top-level
          # `database` above is honoured by the backend but the panel query path
          # needs it here too, otherwise every panel reads "No data" with a
          # "no default database configured" notice even though the datasource
          # tests fine.
          database: {{ .Values.externalGrafana.documentsDatasource.database }}
          sslmode: require
          postgresVersion: 1600
          timescaledb: false
        editable: false
      {{- end }}
{{- end }}
