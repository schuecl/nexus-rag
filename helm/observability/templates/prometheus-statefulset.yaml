{{- /*
StatefulSet rather than Deployment: the TSDB is not shareable and a rolling
Deployment would briefly run two Prometheis against one PVC. Single replica --
this chart is not an HA Prometheus, and pretending otherwise (two replicas, two
TSDBs, no dedup) would give the external Grafana two disagreeing datasources.

Compose passes --storage.tsdb.retention.time and friends through a custom
entrypoint so it can also render the Qdrant credentials file. Here the flags
are just args and the credential is a projected Secret volume, which is what a
container spec is for.
*/}}
{{- if .Values.prometheus.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "observability.fullname" . }}-prometheus
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  serviceName: {{ include "observability.fullname" . }}-prometheus
  selector:
    matchLabels:
      {{- include "observability.componentSelectorLabels" (dict "root" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability.labels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
      annotations:
        # Roll the pod when either ConfigMap changes: Prometheus only reloads on
        # SIGHUP or a /-/reload call, so without this a `helm upgrade` that
        # edits the scrape config appears to succeed and changes nothing.
        checksum/config: {{ include (print $.Template.BasePath "/prometheus-configmap.yaml") . | sha256sum }}
        checksum/rules: {{ include (print $.Template.BasePath "/prometheus-rules-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "observability.fullname" . }}-prometheus
      {{- include "observability.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- /* prom/prometheus runs as nobody (65534) and owns /prometheus as that uid. */}}
        {{- include "observability.podSecurityContext" 65534 | nindent 8 }}
      containers:
        - name: prometheus
          image: {{ include "observability.image" (dict "global" .Values.global "image" .Values.prometheus.image) }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            - --web.enable-lifecycle
            {{- if .Values.prometheus.enableRemoteWriteReceiver }}
            {{- /* Tempo's metrics-generator remote-writes service-graph and
                   span metrics here. Without the receiver the Grafana service
                   map renders empty, which reads as "nothing is instrumented"
                   rather than "nothing is generating the metrics". */}}
            - --web.enable-remote-write-receiver
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.prometheus.service.port }}
          securityContext:
            {{- include "observability.containerSecurityContext" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
            {{- if .Values.nexusRag.qdrant.existingSecret }}
            - name: qdrant-credentials
              mountPath: /etc/prometheus/secrets
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "observability.fullname" . }}-prometheus
        - name: rules
          configMap:
            name: {{ include "observability.fullname" . }}-prometheus-rules
        {{- if .Values.nexusRag.qdrant.existingSecret }}
        - name: qdrant-credentials
          secret:
            secretName: {{ .Values.nexusRag.qdrant.existingSecret }}
            items:
              # Renamed on projection so prometheus.yml's credentials_file path
              # does not depend on what the key happens to be called.
              - key: {{ .Values.nexusRag.qdrant.secretKey }}
                path: qdrant-credentials
        {{- end }}
        {{- if not .Values.prometheus.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.prometheus.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.prometheus.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.prometheus.persistence.size }}
  {{- end }}
{{- end }}
