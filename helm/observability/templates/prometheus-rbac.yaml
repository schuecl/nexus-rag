{{- /*
NFR-3, least privilege: Prometheus needs pod discovery to scrape the four
nexus-rag app services (see prometheus-configmap.yaml for why pod discovery
rather than Service DNS). It gets read-only access to pods/services/endpoints,
and by default only in the two namespaces involved -- a Role per namespace, not
a ClusterRole. prometheus.rbac.clusterWide switches to a ClusterRole for the
case where the nexus-rag release genuinely spans namespaces.
*/}}
{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "observability.fullname" . }}-prometheus
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
{{- if .Values.prometheus.rbac.clusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "observability.fullname" . }}-prometheus
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "observability.fullname" . }}-prometheus
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "observability.fullname" . }}-prometheus
subjects:
  - kind: ServiceAccount
    name: {{ include "observability.fullname" . }}-prometheus
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- /*
Two namespaces to cover: this chart's own (otel-collector and alloy pods) and
the nexus-rag release's (the four app services). They are usually the same, so
dedupe rather than emit a duplicate Role.
*/}}
{{- $namespaces := list .Release.Namespace (include "observability.nexusRagNamespace" .) | uniq }}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "observability.fullname" $ }}-prometheus
  namespace: {{ $ns }}
  labels:
    {{- include "observability.labels" $ | nindent 4 }}
    app.kubernetes.io/component: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "observability.fullname" $ }}-prometheus
  namespace: {{ $ns }}
  labels:
    {{- include "observability.labels" $ | nindent 4 }}
    app.kubernetes.io/component: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "observability.fullname" $ }}-prometheus
subjects:
  - kind: ServiceAccount
    name: {{ include "observability.fullname" $ }}-prometheus
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
