{{- /*
#257: the four Services the external, air-gapped Grafana connects to.

Kept in one file rather than split per component because they are the chart's
defining feature and the thing a reviewer most needs to read together: these
are the only four objects here that are reachable from outside the cluster, and
the LoadBalancer/source-range decision has to be identical across all of them.
Everything else this chart deploys is ClusterIP or has no Service at all.

Ordering matches the Grafana datasource list in grafana-external/datasources.yaml.

The refusal to render an unrestricted LoadBalancer lives in
observability.externalServiceSpec -- see _helpers.tpl.
*/}}
{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability.fullname" . }}-prometheus
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  {{- include "observability.externalServiceAnnotations" (dict "root" . "svc" .Values.prometheus.service) | nindent 2 }}
spec:
  {{- include "observability.externalServiceSpec" (dict "root" . "component" "prometheus" "svc" .Values.prometheus.service) | nindent 2 }}
  selector:
    {{- include "observability.componentSelectorLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.prometheus.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
