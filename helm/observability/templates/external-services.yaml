{{- /*
Tempo's OTLP receiver, and the collector's, are separate ClusterIP Services:
trace *ingest* has different exposure requirements from the query API Grafana
reads, and putting both on one LoadBalancer would publish a write path to
anything allowed to read.
*/}}
{{- if .Values.tempo.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability.fullname" . }}-tempo-otlp
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  type: ClusterIP
  selector:
    {{- include "observability.componentSelectorLabels" (dict "root" . "component" "tempo") | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.tempo.otlpPorts.grpc }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.tempo.otlpPorts.http }}
      targetPort: otlp-http
      protocol: TCP
{{- end }}
