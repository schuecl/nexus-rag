{{- /*
#384: short-lived Q-to-C-to-A evaluations cannot be scraped directly. This
Pushgateway retains their latest sanitized gauges until Prometheus scrapes
them. ClusterIP only: it is a write endpoint, not a Grafana datasource. An
external publisher should use an approved in-boundary gateway, a controlled
port-forward, or run from an allowed namespace rather than exposing this pod.
*/}}
{{- if .Values.pushgateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability.fullname" . }}-pushgateway
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: pushgateway
spec:
  type: {{ .Values.pushgateway.service.type }}
  selector:
    {{- include "observability.componentSelectorLabels" (dict "root" . "component" "pushgateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.pushgateway.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "observability.fullname" . }}-pushgateway
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: pushgateway
spec:
  replicas: 1
  serviceName: {{ include "observability.fullname" . }}-pushgateway
  selector:
    matchLabels:
      {{- include "observability.componentSelectorLabels" (dict "root" . "component" "pushgateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability.labels" . | nindent 8 }}
        app.kubernetes.io/component: pushgateway
    spec:
      {{- include "observability.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "observability.podSecurityContext" 65534 | nindent 8 }}
      containers:
        - name: pushgateway
          image: {{ include "observability.image" (dict "global" .Values.global "image" .Values.pushgateway.image) }}
          args:
            - --persistence.file=/pushgateway/metrics.db
            - --persistence.interval={{ .Values.pushgateway.persistenceInterval }}
          ports:
            - name: http
              containerPort: {{ .Values.pushgateway.service.port }}
          securityContext:
            {{- include "observability.containerSecurityContext" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.pushgateway.resources | nindent 12 }}
          volumeMounts:
            - name: data
              # Official image's writable workdir; fsGroup also gives the PVC
              # to the non-root 65534 process on Kubernetes volume providers.
              mountPath: /pushgateway
      {{- if not .Values.pushgateway.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.pushgateway.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.pushgateway.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.pushgateway.persistence.size }}
  {{- end }}
{{- end }}
