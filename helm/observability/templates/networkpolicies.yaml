{{- /*
#257, following #110's posture but not its default. The nexus-rag chart
defaults networkPolicy.enabled=true because everything it deploys is meant to
be unreachable from outside; this chart's whole purpose is the opposite, so a
default-deny written against a guess about where the external Grafana sits
would break more installs than it protects. Off by default, and an explicit
opt-in once networkPolicy.grafanaCIDRs is known.

Note the overlap with externalAccess.loadBalancerSourceRanges: that is enforced
by the cloud load balancer, this by the CNI. They are not redundant -- traffic
that reaches a node by another path (a pod in the cluster, a NodePort, a
provider that does not honour source ranges) is only stopped by this one.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.grafanaCIDRs }}
{{- fail "networkPolicy.enabled is true but networkPolicy.grafanaCIDRs is empty, which would deny the external Grafana every one of its datasources. Set the CIDRs it connects from." }}
{{- end }}
{{- $allowedNs := .Values.networkPolicy.allowedNamespaces | default (list (include "observability.nexusRagNamespace" .)) }}
{{- range $c := list "prometheus" "loki" "tempo" "alertmanager" }}
{{- $enabled := index $.Values $c "enabled" }}
{{- if $enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "observability.fullname" $ }}-{{ $c }}
  labels:
    {{- include "observability.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c }}
spec:
  podSelector:
    matchLabels:
      {{- include "observability.componentSelectorLabels" (dict "root" $ "component" $c) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # The external Grafana.
    - from:
        {{- range $cidr := $.Values.networkPolicy.grafanaCIDRs }}
        - ipBlock:
            cidr: {{ $cidr | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ (index $.Values $c "service").port }}
    # This chart's own pods: Prometheus scrapes Loki/Tempo/Alertmanager, Tempo
    # remote-writes to Prometheus, Alloy pushes to Loki.
    - from:
        - podSelector:
            matchLabels:
              {{- include "observability.selectorLabels" $ | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ (index $.Values $c "service").port }}
{{- end }}
{{- end }}
{{- if .Values.pushgateway.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "observability.fullname" . }}-pushgateway
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: pushgateway
spec:
  podSelector:
    matchLabels:
      {{- include "observability.componentSelectorLabels" (dict "root" . "component" "pushgateway") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # Prometheus in this chart scrapes the gateway. Publishers are limited to
    # the explicitly allowed namespaces; no unauthenticated public write path.
    - from:
        - podSelector:
            matchLabels:
              {{- include "observability.selectorLabels" . | nindent 14 }}
        {{- range $ns := $allowedNs }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.pushgateway.service.port }}
{{- end }}
{{- if .Values.otelCollector.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "observability.fullname" . }}-otel-collector
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  podSelector:
    matchLabels:
      {{- include "observability.componentSelectorLabels" (dict "root" . "component" "otel-collector") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # OTLP is a write path: only the nexus-rag namespace's pods may push spans.
    # Prometheus needs the telemetry port on top of that, and it lives in this
    # chart's namespace, so both selectors are present.
    - from:
        {{- range $ns := $allowedNs }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "observability.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.otelCollector.service.grpcPort }}
        - protocol: TCP
          port: {{ .Values.otelCollector.service.httpPort }}
        - protocol: TCP
          port: {{ .Values.otelCollector.telemetryPort }}
{{- end }}
{{- end }}
