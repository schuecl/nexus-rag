{{- /*
#257: Tempo, from infra/observability/tempo.yml.

The metrics_generator block is the part that is easy to drop and expensive to
lose. Grafana's Tempo datasource enables the service map and span metrics, but
those are *derived* series: Tempo does not compute them from stored traces on
demand, the generator produces them as spans arrive and remote-writes them to
Prometheus. Without this the service map renders empty, which reads as "nothing
is instrumented" rather than "nothing is generating the metrics" -- and it needs
Prometheus's --web.enable-remote-write-receiver on the other end
(prometheus.enableRemoteWriteReceiver).
*/}}
{{- if .Values.tempo.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability.fullname" . }}-tempo
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
data:
  tempo.yml: |
    stream_over_http_enabled: true

    server:
      http_listen_port: {{ .Values.tempo.service.port }}

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:{{ .Values.tempo.otlpPorts.grpc }}
            http:
              endpoint: 0.0.0.0:{{ .Values.tempo.otlpPorts.http }}

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks

    compactor:
      compaction:
        block_retention: {{ .Values.tempo.blockRetention }}

    {{- if and .Values.tempo.metricsGenerator.enabled .Values.prometheus.enabled }}
    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: http://{{ include "observability.fullname" . }}-prometheus:{{ .Values.prometheus.service.port }}/api/v1/write
            send_exemplars: true
      traces_storage:
        path: /var/tempo/generator/traces

    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics, local-blocks]
    {{- end }}

    usage_report:
      reporting_enabled: false
{{- end }}
