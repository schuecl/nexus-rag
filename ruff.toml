# Ruff configuration for the lint gate (.github/workflows/ci.yml).
# Existing code style is ~100 columns; format-check is intentionally NOT
# enforced yet (would reformat most of the repo in one noisy pass) -- see
# docs/testing.md.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLW", "RUF"]
ignore = [
    # FastAPI idiom: Depends()/Query()/etc. calls in parameter defaults.
    "B008",
]

[lint.isort]
known-first-party = ["common", "app"]
