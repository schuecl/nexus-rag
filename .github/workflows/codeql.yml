# Checked-in ("advanced setup") CodeQL analysis, replacing GitHub's implicit
# default-setup code scanning. This project has been relying on the
# repo-level default setup, which does NOT run on pull_request events opened
# from a fork -- every fork-originated PR (e.g. external contributions)
# never gets a CodeQL check at all, so if branch protection requires that
# check, those PRs are permanently stuck in a "blocked" mergeable state
# regardless of content. Triggering on `pull_request` here (not
# `pull_request_target`) is what actually fixes that: GitHub grants the
# workflow token a scoped, read-only-plus-security-events-write permission
# set for fork PRs specifically so CodeQL's SARIF upload works, without
# giving fork-authored code any broader access to secrets or repo state --
# the standard, documented pattern for scanning external contributions
# safely. See docs/testing.md's security gates section (once #67 lands) for
# how this fits alongside bandit/pip-audit/trivy.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, independent of PR/push activity -- catches newly-published
    # CodeQL query/advisory updates against code that hasn't changed,
    # matching security.yml's "weekly image scans" cadence (once #67 lands).
    - cron: "17 5 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  # Only supersede in-progress runs on pull requests, where a newer push to the
  # PR obsoletes the older analysis. On main (push) and on the weekly schedule
  # the ref is always refs/heads/main, so those triggers share one group -- with
  # cancel-in-progress: true a merge or a coincident scheduled run cancels the
  # other (e.g. two merges seconds apart, or a schedule firing mid-merge), which
  # loses per-commit analysis on the default branch for no benefit. Never cancel
  # there; let each run finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # security-events: write is the one elevated permission CodeQL needs
      # (to upload SARIF results) -- GitHub grants it even on a fork PR's
      # otherwise-read-only pull_request token, scoped to this check only.
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Python is the only source language in this repo (services/,
        # scripts/) -- Dockerfiles/Helm/YAML aren't CodeQL-analyzable
        # languages. Add another entry here if a non-Python service is ever
        # introduced.
        language: ["python"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: ${{ matrix.language }}
          # none: Python is interpreted, nothing to compile -- extraction
          # reads source directly. Replaces the old separate autobuild step
          # (still needed for compiled languages, not this repo).
          build-mode: none
          # security-extended over the bare default suite: this project
          # handles classification/releasability-gated documents and OIDC
          # auth (REQUIREMENTS.md Section 6), which warrants broader query
          # coverage than the default profile despite the extra
          # lower-confidence findings it can surface.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: "/language:${{ matrix.language }}"
