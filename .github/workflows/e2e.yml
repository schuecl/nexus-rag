# E2E: full-stack verification identical to a local run. Brings up the real
# Compose stack (Postgres, Qdrant, NATS, Keycloak, Ollama + models, all four
# custom services), lets seed-sample-data run the FR-1..FR-16 flow, then runs
# the golden-query retrieval harness (FR-30/FR-32), which fails on any
# recall miss against the golden set and on any forbidden (pending/rejected/
# superseded) document leaking into results (FR-26 regression).
#
# Runs nightly and on manual dispatch. golden-query additionally runs on a PR
# that carries the `needs-e2e` label (issue #301) -- the full-stack compose
# boot + ollama model pull is too slow to pay on every PR touching the stack,
# so it's opt-in per-PR rather than path-filtered. browser-verify (issue #187)
# follows the same needs-e2e gating for the same reason. The mutation job is
# nightly/manual-only and advisory until a baseline score is established (see
# docs/testing.md).
name: e2e

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Read-only token: this workflow only builds/runs the stack and uploads
# artifacts, neither of which needs write scopes (#112).
permissions:
  contents: read

jobs:
  golden-query:
    # Nightly/manual runs always execute; a PR only runs it once someone
    # opts in via the `needs-e2e` label (#301) -- a doc-only or unrelated PR
    # doesn't otherwise pay for a full compose boot + model pull it can't
    # affect. A skipped job still reports a (passing) status, so this can't
    # reproduce the "stuck on Expected -- waiting for status" bug the old
    # path filter risked (docs/testing.md).
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'needs-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the dev TLS material Keycloak's HTTPS listener needs
        # #98 gave Keycloak a real HTTPS listener
        # (KC_HTTPS_CERTIFICATE_FILE -> /opt/keycloak/certs/dev.crt, mounted
        # from infra/certs). Those files are generated, not committed, so
        # without this step the container exits(1) on boot with
        # "NoSuchFileException /opt/keycloak/certs/dev.crt" and every service
        # depending on it fails to start. dev-setup.md documents the same
        # script as a prerequisite for a local run.
        #
        # The chmod is CI-specific and deliberately not pushed down into the
        # script, whose 0600 on the private keys is right for a developer's
        # machine. Here the key is bind-mounted into the Keycloak container,
        # which runs as UID 1000, while the runner writes it as UID 1001 --
        # so 0600 reads back as AccessDeniedException inside the container.
        # Only the leaf key Keycloak actually opens is relaxed (never ca.key),
        # on an ephemeral runner, for a throwaway cert regenerated every run.
        run: |
          infra/certs/generate-dev-certs.sh
          chmod 0644 infra/certs/dev.key
      - name: Start the full stack and seed sample data
        # Not `up --wait`: the stack's one-shot containers (ollama-model-init,
        # seed-sample-data, harden-audit-log) exit 0 by design, and --wait
        # treats an early exit as a failure on some compose versions. Wait
        # explicitly on the long-running services' healthchecks, then on each
        # one-shot's exit code.
        env:
          # This job evaluates *retrieval*: evaluate_retrieval.py calls
          # orchestration-mcp's /debug/rag_search, which is dense embedding +
          # BM25 + cross-encoder rerank. Nothing here generates text. Left at
          # its default, ollama-model-init would still pull
          # qwen2.5:7b-instruct (~4.7GB) on every run alongside
          # nomic-embed-text (~275MB) -- minutes of wall clock for a model no
          # assertion in this job touches. Pointing it at the embedding model
          # makes that second `ollama pull` a cache hit.
          #
          # This costs no coverage: the generation path runs through
          # LibreChat/LiteLLM, which this job never drives, and which is
          # blocked upstream anyway (#96/#97). A job that does exercise
          # generation must set this back to a real generation model.
          GENERATION_MODEL: nomic-embed-text
        run: |
          set -e
          docker compose up -d
          # `up -d` is detached, so everything above prints within a second
          # and the minutes that follow are spent in the silent wait below.
          # Without these echoes the step is indistinguishable from a hang
          # until it either finishes or times out 15 minutes later.
          docker compose ps
          echo "::group::Waiting for service healthchecks"
          timeout 900 bash -c '
            for svc in ingestion-api ingestion-worker orchestration-mcp reranker-service; do
              waited=0
              until [ "$(docker inspect --format "{{.State.Health.Status}}" "nexus-rag-$svc-1" 2>/dev/null)" = "healthy" ]; do
                sleep 5
                waited=$((waited + 5))
                if [ $((waited % 30)) -eq 0 ]; then
                  echo "  ... still waiting on $svc (${waited}s, state=$(docker inspect --format "{{.State.Health.Status}}" "nexus-rag-$svc-1" 2>/dev/null || echo absent))"
                fi
              done
              echo "  [healthy] $svc after ${waited}s"
            done'
          echo "::endgroup::"
          echo "Waiting on one-shot containers (model pull, seeding, audit-log hardening)..."
          docker compose wait ollama-model-init seed-sample-data harden-audit-log || true
          for svc in ollama-model-init seed-sample-data harden-audit-log; do
            code=$(docker inspect --format '{{.State.ExitCode}}' "nexus-rag-$svc-1")
            if [ "$code" != "0" ]; then
              echo "::error::$svc exited with code $code"
              exit 1
            fi
          done
      - name: Run the golden-query retrieval evaluation
        run: |
          set -o pipefail
          docker compose --profile eval run --rm eval-retrieval | tee retrieval-eval.txt
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-eval-report
          path: retrieval-eval.txt
          if-no-files-found: ignore
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v

  browser-verify:
    # Issue #187: CSRF double-submit and logout/re-login, driven by a real
    # Chromium against the real Compose stack -- the browser mechanics
    # underneath what services/ingestion-api/tests already covers with
    # TestClient (server-side logic only, no real cookies/redirects). Same
    # opt-in gating as golden-query, for the same reason (full compose boot +
    # model pull is too slow to pay on every PR).
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'needs-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the dev TLS material Keycloak's HTTPS listener needs
        # See golden-query's identical step above for why this is required.
        run: |
          infra/certs/generate-dev-certs.sh
          chmod 0644 infra/certs/dev.key
      - name: Alias `keycloak` to localhost
        # docs/dev-setup.md's "hosts alias" step: Keycloak stamps whichever
        # hostname the request used into its browser-facing discovery
        # metadata (authorization_endpoint, end_session_endpoint), and
        # routes/auth.py's OIDC_BROWSER_ISSUER is the host-external
        # https://keycloak:8443 entry -- a real browser (this job's Chromium,
        # same as a developer's) needs that name to resolve, same as it does
        # server-to-server over the Compose network.
        run: echo "127.0.0.1 keycloak" | sudo tee -a /etc/hosts
      - name: Start the full stack and wait for it to be healthy
        # Same wait strategy as golden-query's step above; this job doesn't
        # need seed-sample-data's documents, only a healthy ingestion-api +
        # Keycloak, but waiting on the same one-shots keeps `docker compose
        # up -d` from racing this job against a still-booting stack.
        env:
          GENERATION_MODEL: nomic-embed-text
        run: |
          set -e
          docker compose up -d
          docker compose ps
          echo "::group::Waiting for service healthchecks"
          timeout 900 bash -c '
            for svc in ingestion-api ingestion-worker orchestration-mcp reranker-service; do
              waited=0
              until [ "$(docker inspect --format "{{.State.Health.Status}}" "nexus-rag-$svc-1" 2>/dev/null)" = "healthy" ]; do
                sleep 5
                waited=$((waited + 5))
                if [ $((waited % 30)) -eq 0 ]; then
                  echo "  ... still waiting on $svc (${waited}s, state=$(docker inspect --format "{{.State.Health.Status}}" "nexus-rag-$svc-1" 2>/dev/null || echo absent))"
                fi
              done
              echo "  [healthy] $svc after ${waited}s"
            done'
          echo "::endgroup::"
          docker compose wait ollama-model-init seed-sample-data harden-audit-log || true
          for svc in ollama-model-init seed-sample-data harden-audit-log; do
            code=$(docker inspect --format '{{.State.ExitCode}}' "nexus-rag-$svc-1")
            if [ "$code" != "0" ]; then
              echo "::error::$svc exited with code $code"
              exit 1
            fi
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-browser.txt
      - name: Install Playwright and Chromium
        # scripts/requirements-browser.txt is deliberately not part of the
        # scripts/Dockerfile image every one-shot container shares -- see
        # that file's header comment.
        run: |
          pip install -r scripts/requirements-browser.txt
          playwright install --with-deps chromium
      - name: Run the browser CSRF/logout verification
        run: python3 scripts/verify_browser_csrf_logout.py
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v

  mutation:
    # Enforced kill-rate gate (#78): >=80% of mutants on the four
    # security-critical modules ([tool.mutmut] in services/common/
    # pyproject.toml) must be killed. Baseline at enforcement time was 88.0%
    # (183 mutants, 161 killed) with every survivor triaged. Still
    # nightly/manual-only, but no longer continue-on-error -- a red run here
    # is a real test-suite weakening, not noise. The gate itself fails
    # closed: an unparseable/crashed mutmut run is a failure, because the
    # advisory era spent weeks green while printing "failed to collect
    # stats" (see docs/testing.md).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install mutmut, test toolchain, and dependencies
        # Deliberately NO install of services/common itself: mutmut must
        # resolve `common` from its own mutated copy, not from an installed
        # package (see tests/conftest.py's MUTANT_UNDER_TEST guard).
        run: |
          pip install mutmut==3.6.0
          pip install -r requirements-test.txt
          pip install "pydantic>=2.7" "PyJWT>=2.8" "cryptography>=42.0" \
            "sqlmodel>=0.0.21" "qdrant-client>=1.10" "pymilvus>=2.5" "nats-py>=2.7" "boto3>=1.34"
      - name: Run mutation testing on services/common
        # Runs from services/common so mutated module names match the test
        # suite's `common.*` imports -- see pyproject.toml's [tool.mutmut].
        # mutmut only auto-copies a tests/ dir inside its project root, so
        # the repo-root tests/ tree is staged here first. The run output is
        # teed to a file because mutmut 3.x reports the full tally only on
        # its progress line -- that file is what the gate below parses.
        run: |
          cd services/common
          mkdir -p tests/unit/common
          cp ../../tests/conftest.py tests/
          cp ../../tests/unit/common/*.py tests/unit/common/
          mutmut run --max-children 4 2>&1 | tee mutmut-run.txt
          mutmut results | tee mutmut-results.txt || true
          rm -rf tests
      - name: Enforce the >=80% kill-rate gate (issue 78)
        if: always()
        run: python scripts/check_mutation_score.py services/common/mutmut-run.txt --min-score 80
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report
          path: |
            services/common/mutmut-run.txt
            services/common/mutmut-results.txt
            services/common/mutants/
          if-no-files-found: ignore
