# CI: the PR gate. Every pull request and every push to main must pass
# unit tests (with the coverage floor), the BDD security scenarios, ruff,
# mypy on services/common, the NFR-16 image-pin check, and a full image
# build. Heavier verification (full-stack golden-query e2e, mutation
# testing, image scans) lives in e2e.yml / security.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default: every job here only ever reads the repo. No job
# writes code scanning results, comments, or releases, so the workflow token
# never needs more than `contents: read` (#112). Any future job that does
# needs to escalate at the job level, not here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test toolchain and service dependencies
        run: |
          pip install -r requirements-test.txt
          # services/common's runtime deps, minus fastembed/psycopg which the
          # unit layer never touches (see .coveragerc's omit rationale). The
          # package itself needs no install: tests/conftest.py puts
          # services/common on sys.path.
          pip install "pydantic>=2.7" "PyJWT>=2.8" "cryptography>=42.0" \
            "sqlmodel>=0.0.21" "qdrant-client>=1.10" "pymilvus>=2.5" "nats-py>=2.7" "boto3>=1.34"
      # The repo-root tree covers services/common (which has no service
      # directory of its own), the cross-cutting BDD scenarios, and the
      # standalone scripts (e.g. the retrieval-eval trend/baseline logic,
      # issue #71). Per-service unit tests live next to their service and run in
      # the service-tests job below -- see issue #113 and docs/testing.md for
      # why they aren't merged into one invocation. The coverage gate stays
      # scoped to `common`; the script tests run but don't count toward it.
      - name: Unit tests + BDD security scenarios (services/common)
        run: >
          pytest tests/unit tests/e2e
          --cov=common --cov-branch --cov-fail-under=85
          --cov-report=xml:coverage-common.xml --cov-report=term-missing -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage-*.xml
          if-no-files-found: error

  service-tests:
    # Per-service unit tests, which live next to the service they cover.
    #
    # Issue #113: these are not duplicates of the repo-root tests/ tree. They
    # carry the regression coverage added alongside the features themselves
    # (#88/#89/#90 table extraction and content_type, #114 oversized chunks,
    # #106..#109), and pytest.ini's `testpaths = tests` deliberately does not
    # reach them.
    #
    # Each service is its own pytest invocation, run from its own directory,
    # and that is not incidental: every service ships a top-level package
    # named `app`. A single process can only ever resolve one of them, so
    # collecting two services together fails outright (`ModuleNotFoundError:
    # No module named 'app.parsing'` once `app` has bound elsewhere). Running
    # one service at a time is what keeps them isolated, and is why each
    # service has its own tests/conftest.py sys.path insert.
    # Issue #256: the check name is pinned explicitly (below) rather than left
    # to GitHub's matrix-derived default, so the `cov` list can change without
    # renaming the check out from under the required-status-checks rulesets.
    # See docs/testing.md's "Branch protection (merge gates)" section for the
    # coordinated ruleset edit this required to land.
    name: service-tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # cov: the modules whose coverage is gated for this service, or
          # empty to run the suite without a coverage floor. ingestion-api is
          # ungated on purpose -- its FastAPI route layer needs the
          # containerized integration layer to be meaningfully covered (see
          # docs/testing.md's known-gaps list).
          - service: ingestion-api
            cov: ""
          - service: ingestion-worker
            cov: "--cov=app.chunking --cov=app.parsing --cov=app.ocr"
          - service: orchestration-mcp
            cov: "--cov=app.reranking"
          - service: reranker-service
            cov: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test toolchain and the service's dependencies
        run: |
          # respx backs the reranker HTTP stubs; mcp and prometheus-client are
          # orchestration-mcp's own runtime deps, imported transitively via
          # app/server.py (mcp) and app/metrics.py (prometheus-client, #72).
          # mcp held <2.0: 2.0.0 removed/renamed mcp.server.fastmcp (#205).
          pip install pytest pytest-asyncio pytest-cov respx "mcp>=1.6,<2.0" "prometheus-client>=0.20"
          pip install --no-deps -e services/common
          pip install "pydantic>=2.7" "PyJWT>=2.8" "cryptography>=42.0" \
            "sqlmodel>=0.0.21" "qdrant-client>=1.10" "pymilvus>=2.5" "nats-py>=2.7" "boto3>=1.34" \
            "fastapi>=0.115" "httpx>=0.27" "python-multipart>=0.0.9" "jinja2>=3.1" \
            "opentelemetry-api>=1.30" "opentelemetry-sdk>=1.30" "opentelemetry-exporter-otlp-proto-http>=1.30" \
            "opentelemetry-instrumentation-fastapi>=0.51b0" "opentelemetry-instrumentation-httpx>=0.51b0"
          # ingestion-worker's parsers; harmless (and cached) for the others.
          pip install "pypdf>=6.14.2" "pdfplumber>=0.11" "python-docx>=1.1" \
            "python-pptx>=1.0" "openpyxl>=3.1" "pytesseract>=0.3.10" "beautifulsoup4>=4.12"
          # reranker-service's own runtime dep -- imported at module level by
          # app/main.py, so even the shared-secret unit tests need it importable
          # (the tests never construct a CrossEncoder, so no model download).
          pip install "sentence-transformers>=3.0"
      - name: pytest (services/${{ matrix.service }}/tests)
        working-directory: services/${{ matrix.service }}
        run: >
          pytest tests -q
          ${{ matrix.cov && format('{0} --cov-branch --cov-fail-under=85 --cov-report=term-missing', matrix.cov) || '' }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.0
      - name: ruff check
        run: ruff check --output-format=github services scripts tests
      - name: ruff format --check
        run: ruff format --check services scripts tests

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install mypy and services/common dependencies
        run: |
          pip install mypy==2.3.0
          pip install --no-deps -e services/common
          pip install "pydantic>=2.7" "PyJWT>=2.8" "cryptography>=42.0" \
            "sqlmodel>=0.0.21" "qdrant-client>=1.10" "pymilvus>=2.5" "nats-py>=2.7" "boto3>=1.34" \
            "opentelemetry-api>=1.30" "opentelemetry-sdk>=1.30" "opentelemetry-exporter-otlp-proto-http>=1.30"
      - name: mypy on services/common (enforced)
        run: mypy services/common/common
      - name: Install reranker-service dependencies
        run: |
          pip install "fastapi>=0.115" \
            "opentelemetry-instrumentation-fastapi>=0.51b0" \
            "prometheus-client>=0.20"
      - name: mypy on reranker-service (enforced, issue #79)
        run: cd services/reranker-service && mypy app
      - name: Install ingestion-worker dependencies
        run: |
          pip install "fastapi>=0.115" "httpx>=0.27" \
            "opentelemetry-instrumentation-httpx>=0.51b0" \
            "pypdf>=6.14.2" "pdfplumber>=0.11" "python-docx>=1.1" \
            "python-pptx>=1.0" "openpyxl>=3.1" "pillow>=10.0" "pytesseract>=0.3.10" "beautifulsoup4>=4.12"
      - name: mypy on ingestion-worker (enforced, issue #79)
        run: cd services/ingestion-worker && MYPYPATH=../common mypy app
      - name: Install orchestration-mcp dependencies
        run: |
          # mcp held <2.0: 2.0.0 removed/renamed mcp.server.fastmcp (#205).
          pip install "mcp>=1.6,<2.0" "httpx>=0.27" "prometheus-client>=0.20" \
            "opentelemetry-instrumentation-httpx>=0.51b0"
      - name: mypy on orchestration-mcp (enforced, issue #79)
        run: cd services/orchestration-mcp && MYPYPATH=../common mypy app
      - name: Install ingestion-api dependencies
        run: |
          pip install "fastapi>=0.115" "httpx>=0.27" "jinja2>=3.1" \
            "python-multipart>=0.0.9" "opentelemetry-instrumentation-fastapi>=0.51b0"
      - name: mypy on ingestion-api (enforced, issue #79)
        run: cd services/ingestion-api && MYPYPATH=../common mypy app

  pin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: NFR-16 -- no floating image tags
        run: python scripts/check_pinned_images.py
      - name: Issue #210 -- reranker/BM25 model revisions stay pinned
        run: python scripts/check_pinned_models.py
      # #111: the Compose stack is what dev-setup.md and e2e.yml actually
      # exercise, so its hardening is enforced here rather than left to
      # review -- otherwise the chart's securityContext only ever runs in an
      # environment nobody uses day to day.
      - name: Issue #111 -- Compose hardening matches the chart
        run: |
          # This job installs no requirements file, so pyyaml comes in here.
          # The `unit` job gets it from requirements-test.txt instead, which is
          # what the guard's own tests need.
          pip install "pyyaml==6.0.3"
          python scripts/check_compose_hardening.py
      # Issue #212: the same NATS per-user permissions exist as two files
      # (infra/nats/nats.conf and helm/nexus-rag/files/nats.conf) because
      # Helm can't reference files outside its own chart directory.
      - name: Issue #212 -- NATS ACL config matches across compose and chart
        run: python scripts/check_nats_conf_sync.py
      # Issue #257: same reason as #212, applied to the Grafana dashboards and
      # Prometheus alert rules that helm/observability vendors. A dashboard
      # fixed on one side only means the air-gapped Grafana imports the stale
      # copy and nothing reports it.
      - name: Issue #257 -- observability assets match across compose and chart
        run: python scripts/check_observability_assets_sync.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build all custom service images
        run: >
          docker compose build
          ingestion-api ingestion-worker orchestration-mcp reranker-service
