name: Enhancement / feature request
description: Propose a change or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see happen?
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Related requirement or issue
      description: Which FR-*/NFR-* in REQUIREMENTS.md, or which existing issue, does this relate to?
      placeholder: "e.g. FR-26, NFR-11, or #123"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one.
    validations:
      required: false
