version: 2

# Shared notes:
# - pytest is held below 9.1 (pinned at 9.0.3 in requirements-test.txt), NOT on
#   the 8.x line -- that older description was left behind by the 8.x -> 9.0
#   bump. pytest-bdd 8.1.0 registers fixtures by nodeid, which pytest 9.1 turns
#   into PytestRemovedIn10Warning, and pytest.ini's `filterwarnings = error`
#   makes that fatal: every BDD scenario in tests/e2e fails (verified on PR
#   #481 -- 12 failures on both 3.11 and 3.12). pytest-bdd's newest release is
#   still 8.1.0, so there is nothing to upgrade to yet.
#   Every pip ecosystem below therefore ignores pytest MINOR bumps as well as
#   majors. Ignoring majors alone was not enough -- 9.0.3 -> 9.1.1 is a minor,
#   so it sailed past the filter and became PR #481. Drop the minor entry (and
#   raise the pin in requirements-test.txt) once pytest-bdd ships a
#   9.1-compatible release; see the NOTE in requirements-test.txt.
# - Each ecosystem groups its minor+patch updates into a single PR to cut the
#   weekly volume. Major bumps are deliberately left ungrouped so each lands as
#   its own PR and gets reviewed on its own.
# - Issue #230: services/common and every services/*/ pip directory below also
#   carries a hash-pinned requirements.txt, compiled from requirements.in with
#   `pip-compile --generate-hashes` (reranker-service's excludes torch --
#   installed separately from a configurable index, see its requirements.in).
#   Dependabot's pip ecosystem detects the pip-compile header comment in a
#   requirements.txt and updates it (version *and* hashes) by re-running
#   pip-compile against its requirements.in, alongside the pyproject.toml
#   floor bumps already configured per directory below -- no separate
#   ecosystem entry is needed for the lockfiles themselves. Not yet observed
#   against a live Dependabot run in this repo; flag if a lockfile update PR
#   doesn't regenerate hashes as expected.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # requirements-test.txt at the repo root
    ignore:
      - dependency-name: pytest
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      pip-test-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /services/common
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pytest
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      pip-common:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /services/ingestion-api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pytest
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      pip-ingestion-api:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /services/ingestion-worker
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pytest
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      pip-ingestion-worker:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /services/orchestration-mcp
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pytest
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      pip-orchestration-mcp:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /services/reranker-service
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pytest
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      pip-reranker-service:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
