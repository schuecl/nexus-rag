version: 2

# Shared notes:
# - pytest is held on the 8.x line: pytest 9 drops fixture-registration APIs
#   that pytest-bdd 8.1 still uses, which breaks the BDD suite (verified: 10
#   failures in tests/e2e). Every pip ecosystem below ignores pytest majors so
#   that bump stops being re-proposed until pytest-bdd is compatible; see the
#   NOTE in requirements-test.txt.
# - Each ecosystem groups its minor+patch updates into a single PR to cut the
#   weekly volume. Major bumps are deliberately left ungrouped so each lands as
#   its own PR and gets reviewed on its own.
# - Issue #230: services/common and every services/*/ pip directory below also
#   carries a hash-pinned requirements.txt, compiled from requirements.in with
#   `pip-compile --generate-hashes` (reranker-service's excludes torch --
#   installed separately from a configurable index, see its requirements.in).
#   Dependabot's pip ecosystem detects the pip-compile header comment in a
#   requirements.txt and updates it (version *and* hashes) by re-running
#   pip-compile against its requirements.in, alongside the pyproject.toml
#   floor bumps already configured per directory below -- no separate
#   ecosystem entry is needed for the lockfiles themselves. Not yet observed
#   against a live Dependabot run in this repo; flag if a lockfile update PR
#   doesn't regenerate hashes as expected.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # requirements-test.txt at the repo root
    ignore:
      - dependency-name: pytest
        update-types: ["version-update:semver-major"]
    groups:
      pip-test-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /services/common
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pytest
        update-types: ["version-update:semver-major"]
    groups:
      pip-common:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /services/ingestion-api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pytest
        update-types: ["version-update:semver-major"]
    groups:
      pip-ingestion-api:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /services/ingestion-worker
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pytest
        update-types: ["version-update:semver-major"]
    groups:
      pip-ingestion-worker:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /services/orchestration-mcp
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pytest
        update-types: ["version-update:semver-major"]
    groups:
      pip-orchestration-mcp:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /services/reranker-service
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pytest
        update-types: ["version-update:semver-major"]
    groups:
      pip-reranker-service:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
