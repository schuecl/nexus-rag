# Issue #75: LibreChat v0.8.7 has no built-in HTTPS listener (api/server/index.js
# always does a plain app.listen(port, host)), but its OIDC flow needs a real
# HTTPS round-trip at DOMAIN_CLIENT/DOMAIN_SERVER (https://localhost:3080) --
# this terminates TLS with the dev cert and forwards plaintext to LibreChat.
#
# Issue #471: only a literal "websocket" Upgrade request gets forwarded --
# anything else (e.g. h2c) is rewritten to an empty Upgrade/Connection: close,
# which can't complete a protocol switch -- closing off H2C smuggling through
# this proxy. Two maps because the outbound Upgrade header must itself be
# sanitized, not just the derived Connection header. semgrep's rule matches
# on the presence of proxy_http_version/Upgrade/Connection directives, not on
# what they're set to, so it still flags this block even with the whitelist
# in place -- nosemgrep'd below with that in mind.
map $http_upgrade $connection_upgrade {
    default   close;
    websocket upgrade;
}

map $http_upgrade $upgrade_header {
    default   "";
    websocket websocket;
}

server {
    listen 3080 ssl;
    server_name localhost;

    ssl_certificate     /certs/dev.crt;
    ssl_certificate_key /certs/dev.key;

    # nginx's own status for "plain HTTP spoken to an HTTPS port". Without
    # this the browser gets a bare 400 whose body is nginx's default error
    # page, which reads as "the app is broken" rather than "use https".
    # Redirecting is the least surprising thing to do with a URL a person
    # typed, and http://localhost:3080 is the URL people type.
    #
    # Issue #472: the request's Host header is attacker-controlled; server_name
    # above is already the fixed literal this proxy is meant to serve, so use
    # that instead of trusting the request.
    error_page 497 =301 https://$server_name:3080$request_uri;

    # Docker's embedded DNS. Without a resolver, nginx resolves `librechat`
    # once at startup and caches the address for the process's lifetime -- so
    # recreating that container (which gives it a new IP) leaves this proxy
    # dialling the old one and returning 502 until nginx is also restarted.
    # The symptom points at the proxy, the cause is three steps away; it cost
    # a real debugging session.
    #
    # `valid=10s` re-resolves on that interval, and proxy_pass through a
    # variable is what forces the runtime lookup -- a literal upstream in
    # proxy_pass is still resolved once at config load, resolver or not.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Issue #470: semgrep's missing-internal rule is aimed at locations only
    # meant to be reached via an internal redirect (X-Accel-Redirect,
    # error_page, etc.) -- adding `internal;` here would 404 every real
    # client request, since this location *is* the proxy's sole public
    # entrypoint (there's no other server block for browsers to hit).
    location / {
        set $librechat_upstream http://librechat:3080;
        proxy_pass $librechat_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # LibreChat streams chat responses over SSE and uses websockets for
        # some MCP transports -- buffering/upgrade must stay off/on accordingly.
        proxy_buffering off;
        proxy_set_header Upgrade $upgrade_header;
        proxy_set_header Connection $connection_upgrade;
    }
}
