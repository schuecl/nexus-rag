# Issue #75: LibreChat v0.8.7 has no built-in HTTPS listener (api/server/index.js
# always does a plain app.listen(port, host)), but its OIDC flow needs a real
# HTTPS round-trip at DOMAIN_CLIENT/DOMAIN_SERVER (https://localhost:3080) --
# this terminates TLS with the dev cert and forwards plaintext to LibreChat.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3080 ssl;
    server_name localhost;

    ssl_certificate     /certs/dev.crt;
    ssl_certificate_key /certs/dev.key;

    # nginx's own status for "plain HTTP spoken to an HTTPS port". Without
    # this the browser gets a bare 400 whose body is nginx's default error
    # page, which reads as "the app is broken" rather than "use https".
    # Redirecting is the least surprising thing to do with a URL a person
    # typed, and http://localhost:3080 is the URL people type.
    error_page 497 =301 https://$host:3080$request_uri;

    # Docker's embedded DNS. Without a resolver, nginx resolves `librechat`
    # once at startup and caches the address for the process's lifetime -- so
    # recreating that container (which gives it a new IP) leaves this proxy
    # dialling the old one and returning 502 until nginx is also restarted.
    # The symptom points at the proxy, the cause is three steps away; it cost
    # a real debugging session.
    #
    # `valid=10s` re-resolves on that interval, and proxy_pass through a
    # variable is what forces the runtime lookup -- a literal upstream in
    # proxy_pass is still resolved once at config load, resolver or not.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $librechat_upstream http://librechat:3080;
        proxy_pass $librechat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # LibreChat streams chat responses over SSE and uses websockets for
        # some MCP transports -- buffering/upgrade must stay off/on accordingly.
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
