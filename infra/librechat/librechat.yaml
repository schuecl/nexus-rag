# Throwaway dev LibreChat config (NFR-9). Only enough to exercise Keycloak
# login and the orchestration-mcp connection -- not a production config.
version: 1.2.8
cache: true

# Issue #75: without this, LibreChat's default-deny SSRF protection
# (packages/api/src/auth/domain.ts's isDomainAllowedCore) blocks the
# orchestration-mcp connection outright -- it resolves to a private Docker
# network IP, and with no allowedDomains configured at all, private/reserved
# IPs are always rejected regardless of intent. Explicitly allowlisting this
# internal hostname is the supported pattern for docker-internal MCP servers,
# confirmed against api/server/services/MCP.js's isEarlyDomainAllowed check.
mcpSettings:
  allowedDomains:
    - "http://orchestration-mcp:8002"

endpoints:
  custom:
    - name: "LiteLLM"
      apiKey: "${LITELLM_MASTER_KEY}"
      baseURL: "http://litellm:4000/v1"
      models:
        # LibreChat only resolves ${ENV_VAR} substitution in apiKey/baseURL/
        # headers, not inside models.default -- so this has to be the literal
        # model_name from infra/litellm/config.yaml, not GENERATION_MODEL.
        # Keep the two in sync by hand if either changes. qwen2.5:7b-instruct,
        # not llama3.2:1b -- see infra/litellm/config.yaml's comment (issue
        # #99 follow-up: llama3.2:1b's tool-calling was unreliable).
        default: ["qwen2.5:7b-instruct"]
        fetch: false
      titleConvo: true
    # Testing-only escape hatch that bypasses litellm entirely -- lets you
    # tell apart "Ollama itself is broken" from "the LiteLLM hop is broken"
    # when debugging the generation path. Ollama's own OpenAI-compatible API
    # (0.32.1 has it) needs no real credential, so apiKey is just a
    # placeholder; fetch: true lists whatever's actually pulled rather than
    # hardcoding a model name a second time.
    - name: "Ollama-Direct"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1"
      models:
        default: ["qwen2.5:7b-instruct"]
        fetch: true
      titleConvo: false

mcpServers:
  # Short key deliberately: LibreChat namespaces every MCP tool as
  # "{tool}_mcp_{this key}" in the schema it sends to the model (e.g.
  # "rag_search_mcp_nexus-rag-search" when this was the longer original
  # name) -- confirmed live (issue #99 follow-up, 2026-07-26) that the
  # longer composite name measurably hurt small local models' tool-call
  # reliability, on top of the docstring-length effect documented in
  # app/server.py. Renaming to "rag" shortens the model-facing name to
  # "rag_search_mcp_rag".
  rag:
    type: streamable-http
    url: "http://orchestration-mcp:8002/mcp"
    # Section 7.7: OBO token exchange was the intended identity-propagation
    # mode (exchanging the user's LibreChat session token for one scoped to
    # this MCP server's audience, the rag-app client, rather than forwarding
    # the whole-session token) -- but a real end-to-end run (bob-query,
    # 2026-07-26) showed LibreChat's actual OboTokenService calls Keycloak's
    # token endpoint with grant_type=urn:ietf:params:oauth:grant-type:
    # jwt-bearer (RFC 7523), not grant_type=token-exchange (RFC 8693) as the
    # realm's standard.token.exchange.enabled attribute (on the librechat
    # client) was configured for and had been manually verified against.
    # Keycloak 26.7's RFC 7523 support ("JWT Authorization Grant", new in
    # 26.5) is built for external-IdP identity chaining -- it needs an
    # Identity Provider registered and linked on the client, and it's
    # undocumented/unverified whether a same-realm self-issued token (our
    # case) is even a supported source for it. Rather than chase that,
    # switched to addUserJwtToken: forwards the raw LibreChat session token
    # instead of exchanging it. This still passes orchestration-mcp's
    # audience check: Keycloak's nexus-rag-claims client scope (shared by
    # both librechat and rag-app) stamps aud=rag-app onto every
    # librechat-issued token via its audience mapper regardless of azp, and
    # rag_search (services/orchestration-mcp/app/rag_search.py via
    # common.claims.parse_claims) only checks aud, not azp. Trade-off: the
    # MCP server now sees the user's full librechat-scoped token rather than
    # one narrowed to the rag-app audience by an actual exchange -- revisit
    # if/when Keycloak's same-realm JWT Authorization Grant story is clearer.
    addUserJwtToken: true
    # orchestration-mcp's rag_search tool reads the bearer token from the
    # forwarded Authorization header on this connection (verified against the
    # real MCP client SDK, see services/orchestration-mcp/app/server.py) --
    # whatever LibreChat puts there per addUserJwtToken above reaches it
    # correctly.
