# Throwaway dev LibreChat config (NFR-9). Only enough to exercise Keycloak
# login and the orchestration-mcp connection -- not a production config.
version: 1.2.8
cache: true

# Issue #75: without this, LibreChat's default-deny SSRF protection
# (packages/api/src/auth/domain.ts's isDomainAllowedCore) blocks the
# orchestration-mcp connection outright -- it resolves to a private Docker
# network IP, and with no allowedDomains configured at all, private/reserved
# IPs are always rejected regardless of intent. Explicitly allowlisting this
# internal hostname is the supported pattern for docker-internal MCP servers,
# confirmed against api/server/services/MCP.js's isEarlyDomainAllowed check.
mcpSettings:
  allowedDomains:
    - "http://orchestration-mcp:8002"
    # Issue #99 follow-up (2026-07-26): separately needed for the rag MCP
    # server's OAuth login (below) -- LibreChat refused to redirect to
    # Keycloak at all ("OAuth authorization_url resolves to a private IP
    # address"), because `keycloak` resolves to a private Docker-network IP
    # from this container's own DNS, even though the *browser* can reach it
    # fine via the /etc/hosts alias from issue #75. Tried `allowedAddresses`
    # first (host:port pairs, meant as exactly this kind of private-IP SSRF
    # exemption per packages/data-provider/src/config.ts's
    # allowedAddressesSchema) -- didn't work. Read packages/api's actual
    # isOAuthUrlAllowed(): once `allowedDomains` is non-empty (it already is,
    # for the entry above), it becomes the sole authority for the OAuth check
    # and `allowedAddresses` is ignored outright ("letting it short-circuit
    # here would broaden a strict admin-configured OAuth scope", per that
    # function's own comment) -- has to go in allowedDomains instead.
    - "https://keycloak:8443"

endpoints:
  custom:
    - name: "LiteLLM"
      apiKey: "${LITELLM_MASTER_KEY}"
      baseURL: "http://litellm:4000/v1"
      # #195: Ollama 0.32.1 does not emit structured tool_calls while
      # streaming (confirmed against both its OpenAI-compatible and native
      # chat APIs). It streams the raw tool-call JSON as plain content, so
      # LibreChat displays it instead of executing rag_search. Non-streaming
      # returns a proper tool_call; trade token-by-token display for a working
      # dev RAG path.
      disableStreaming: true
      models:
        # LibreChat only resolves ${ENV_VAR} substitution in apiKey/baseURL/
        # headers, not inside models.default -- so this has to be the literal
        # model_name from infra/litellm/config.yaml, not GENERATION_MODEL.
        # Keep the two in sync by hand if either changes. qwen2.5:3b-instruct,
        # not llama3.2:1b -- see infra/litellm/config.yaml's comment (issue
        # #99 follow-up: llama3.2:1b's tool-calling was unreliable).
        default: ["qwen2.5:3b-instruct"]
        fetch: false
      titleConvo: true
    # Testing-only escape hatch that bypasses litellm entirely -- lets you
    # tell apart "Ollama itself is broken" from "the LiteLLM hop is broken"
    # when debugging the generation path. Ollama's own OpenAI-compatible API
    # (0.32.1 has it) needs no real credential, so apiKey is just a
    # placeholder; fetch: true lists whatever's actually pulled rather than
    # hardcoding a model name a second time.
    - name: "Ollama-Direct"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1"
      models:
        default: ["qwen2.5:3b-instruct"]
        fetch: true
      titleConvo: false

mcpServers:
  # Short key deliberately: LibreChat namespaces every MCP tool as
  # "{tool}_mcp_{this key}" in the schema it sends to the model (e.g.
  # "rag_search_mcp_nexus-rag-search" when this was the longer original
  # name) -- confirmed live (issue #99 follow-up, 2026-07-26) that the
  # longer composite name measurably hurt small local models' tool-call
  # reliability, on top of the docstring-length effect documented in
  # app/server.py. Renaming to "rag" shortens the model-facing name to
  # "rag_search_mcp_rag".
  rag:
    type: streamable-http
    url: "http://orchestration-mcp:8002/mcp"
    # Per-user OAuth login for this MCP server specifically (RFC 6749
    # authorization_code -- LibreChat prompts a "Connect" step and redirects
    # through a real Keycloak login the first time a user invokes the tool,
    # then stores/refreshes the resulting token per user), not LibreChat's
    # own OIDC login above and not OBO. Two things were tried and ruled out
    # first (issue #99 follow-up, 2026-07-26):
    #
    # 1. `addUserJwtToken: true` (forward the user's raw LibreChat session
    #    token as-is): looked like it worked from reading the code, but a
    #    live capture (tcpdump on orchestration-mcp's own port, inspecting
    #    the actual POST /mcp request LibreChat sent) showed no Authorization
    #    header at all. Grepped the installed LibreChat build's actual
    #    StreamableHTTPOptionsSchema (packages/data-provider) and confirmed
    #    `addUserJwtToken` isn't a recognized field in this version at all --
    #    Zod silently drops unknown keys, so this had been a no-op the whole
    #    time, not a working mechanism that broke later.
    # 2. `obo` (RFC 7523 jwt-bearer exchange): LibreChat's OboTokenService
    #    does call grant_type=jwt-bearer for real (confirmed via an actual
    #    failing request), but Keycloak 26.7's implementation requires the
    #    assertion's issuer to be a registered, linked external Identity
    #    Provider, and the assertion's `aud` to equal Keycloak's own issuer/
    #    token-endpoint URL -- neither fits librechat and rag-app being two
    #    clients in the same realm on the same Keycloak instance (confirmed
    #    against Keycloak's own docs, not assumption). Making this fit would
    #    mean a self-referential Identity-Provider setup plus reworking the
    #    audience scheme the existing claims check depends on -- not a small
    #    tweak, and swapping to a different self-hosted IdP (checked
    #    Authentik, Ory Hydra, Zitadel) doesn't sidestep it either, since the
    #    grant_type LibreChat sends is fixed regardless of which IdP is
    #    behind it.
    #
    # OAuth login sidesteps both: it's a normal authorization_code flow
    # against Keycloak (which is what Keycloak is for), so the resulting
    # token is issued exactly like any other Keycloak token and passes
    # orchestration-mcp's existing signature/audience check
    # (common.claims.parse_claims) unmodified. Reuses the existing rag-app
    # client rather than provisioning a new one -- already confidential,
    # already carries the nexus-rag-claims scope the access filter needs.
    #
    # startup: false is required, not optional, here: an OAuth-gated server
    # is inherently per-user, so it can't be part of LibreChat's shared
    # app-level startup connection pool the way the old token-forwarding
    # config could be.
    startup: false
    # Kept explicit even though orchestration-mcp now also returns a standard
    # 401/WWW-Authenticate challenge at the transport boundary. That boundary
    # enforcement is essential after connection setup too: when a 15-minute
    # Keycloak access token expires, LibreChat recognizes the 401, refreshes
    # the token, and reconnects instead of receiving a tool-level
    # {"error":"Signature has expired"} inside an HTTP 200 response.
    requiresOAuth: true
    oauth:
      # Browser-facing: matches OPENID_ISSUER's host/port below (the
      # /etc/hosts alias + trusted dev cert from issue #75 already cover
      # this hostname for the browser).
      authorization_url: "https://keycloak:8443/realms/nexus-rag/protocol/openid-connect/auth"
      # Backend-to-backend (LibreChat's Node server calls this directly,
      # not the browser) -- same trusted host as above.
      token_url: "https://keycloak:8443/realms/nexus-rag/protocol/openid-connect/token"
      client_id: rag-app
      # ${VAR} substitution is NOT supported for oauth.client_secret --
      # confirmed from the bundled data-provider schema: only
      # authorization_url/token_url/redirect_uri/revocation_endpoint get
      # extractEnvVariable(); client_id/client_secret/scope don't. Has to be
      # a literal value -- matches the same dev-only secret already
      # hardcoded for this client in infra/keycloak/realm-export and
      # docker-compose.yml's own default (never a real secret past
      # throwaway local dev).
      client_secret: dev-rag-app-secret
      scope: "openid profile email"
      # Without an explicit endpoint LibreChat guesses /revoke on the MCP
      # origin, which is not Keycloak and returns 404 when a user disconnects.
      revocation_endpoint: "https://keycloak:8443/realms/nexus-rag/protocol/openid-connect/revoke"
