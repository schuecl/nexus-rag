global:
  resolve_timeout: 5m

route:
  receiver: local-ui
  group_by: ["alertname", "severity"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h

receivers:
  # Dev-safe default: alerts are visible in Alertmanager and Grafana without
  # sending to an external person/system. Production should replace this
  # receiver with the environment's approved notification integration.
  - name: local-ui
