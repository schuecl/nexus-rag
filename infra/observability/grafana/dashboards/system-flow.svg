<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/>
    </marker>
  </defs>
  <style>
    .lbl { fill:#e6e9ef; font-size:15px; font-weight:600; text-anchor:middle; pointer-events:none; }
    .sub { fill:#aeb6c2; font-size:11px; text-anchor:middle; pointer-events:none; }
    .edge { stroke:#9aa4b2; stroke-width:2; fill:none; marker-end:url(#arrow); }
    .box { rx:8; ry:8; stroke:#3a4150; stroke-width:2; fill:#2a2f3a; }
    .zone { fill:none; stroke:#3a4150; stroke-dasharray:4 4; rx:10; ry:10; }
    .zlbl { fill:#8892a0; font-size:12px; font-weight:700; }
  </style>

  <!-- zones -->
  <rect class="zone" x="10" y="45" width="360" height="70"/>
  <text class="zlbl" x="20" y="40">ENTRY / AUTH</text>
  <rect class="zone" x="10" y="150" width="960" height="120"/>
  <text class="zlbl" x="20" y="145">INGESTION  (upload → queue → embed → store)</text>
  <rect class="zone" x="10" y="300" width="700" height="120"/>
  <text class="zlbl" x="20" y="295">RETRIEVAL  (query → hybrid search → rerank)</text>
  <rect class="zone" x="10" y="450" width="500" height="80"/>
  <text class="zlbl" x="20" y="445">GENERATION</text>

  <!-- edges (drawn first, under boxes) -->
  <path class="edge" d="M110,115 L110,175"/>            <!-- librechat -> ingestion-api -->
  <path class="edge" d="M170,90 L110,90 M250,90 L190,90"/>
  <path class="edge" d="M280,90 L110,90"/>              <!-- keycloak -> librechat -->
  <path class="edge" d="M200,200 L250,200"/>            <!-- ingestion-api -> nats -->
  <path class="edge" d="M390,200 L440,200"/>            <!-- nats -> worker -->
  <path class="edge" d="M620,200 L700,200"/>            <!-- worker -> qdrant -->
  <path class="edge" d="M540,225 L330,355"/>            <!-- worker -> ollama (embed) -->
  <path class="edge" d="M200,340 L440,340"/>            <!-- mcp -> reranker -->
  <path class="edge" d="M180,330 L720,240"/>            <!-- mcp -> qdrant -->
  <path class="edge" d="M120,365 L120,355"/>
  <path class="edge" d="M110,300 L110,270"/>            <!-- librechat -> mcp (query) via api -->
  <path class="edge" d="M150,490 L250,490"/>            <!-- litellm -> ollama gen -->
  <path class="edge" d="M110,450 L110,410"/>            <!-- generation up to retrieval/ollama -->

  <!-- component boxes (id = metric dataRef) -->
  <rect id="librechat" class="box" x="30" y="55" width="160" height="50"/>
  <text class="lbl" x="110" y="78">LibreChat</text><text class="sub" x="110" y="95">chat UI (HTTPS)</text>

  <rect id="keycloak" class="box" x="260" y="55" width="100" height="50"/>
  <text class="lbl" x="310" y="78">Keycloak</text><text class="sub" x="310" y="95">OIDC</text>

  <rect id="ingestion-api" class="box" x="30" y="175" width="170" height="50"/>
  <text class="lbl" x="115" y="198">ingestion-api</text><text class="sub" x="115" y="215">upload · tag · curate</text>

  <rect id="nats" class="box" x="250" y="175" width="140" height="50"/>
  <text class="lbl" x="320" y="198">NATS</text><text class="sub" x="320" y="215">JetStream (NFR-11)</text>

  <rect id="ingestion-worker" class="box" x="440" y="175" width="180" height="50"/>
  <text class="lbl" x="530" y="198">ingestion-worker</text><text class="sub" x="530" y="215">parse·chunk·embed</text>

  <rect id="postgres" class="box" x="700" y="55" width="140" height="50"/>
  <text class="lbl" x="770" y="78">Postgres</text><text class="sub" x="770" y="95">documents · audit</text>

  <rect id="qdrant" class="box" x="700" y="175" width="140" height="60"/>
  <text class="lbl" x="770" y="200">Qdrant</text><text class="sub" x="770" y="218">vector store</text>

  <rect id="orchestration-mcp" class="box" x="30" y="320" width="170" height="50"/>
  <text class="lbl" x="115" y="343">orchestration-mcp</text><text class="sub" x="115" y="360">rag_search (MCP)</text>

  <rect id="reranker" class="box" x="440" y="320" width="150" height="50"/>
  <text class="lbl" x="515" y="343">reranker</text><text class="sub" x="515" y="360">cross-encoder</text>

  <rect id="ollama" class="box" x="250" y="460" width="140" height="50"/>
  <text class="lbl" x="320" y="483">Ollama</text><text class="sub" x="320" y="500">embed + generate</text>

  <rect id="litellm" class="box" x="30" y="460" width="150" height="50"/>
  <text class="lbl" x="105" y="483">LiteLLM</text><text class="sub" x="105" y="500">model gateway</text>
</svg>
