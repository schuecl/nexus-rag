apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          datasourceUid: tempo
          url: "$${__value.raw}"

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        tags: ["service.name"]
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        tags:
          - key: service.name
            value: job
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

  # #133/#349: backend deployed, no data yet -- nothing in this repo pushes
  # profiles to it until #349's instrumentation lands. Present so the
  # datasource (and trace-to-profiles correlation, once #349 tags spans and
  # profiles with the same service.name) exists without a manual click.
  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040
    editable: false

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus

  # #133: metadata-only Postgres datasource for the Documents dashboard.
  # Connects as grafana_ro, which can read the document_metrics view only.
  - name: Documents (Postgres)
    uid: documents-pg
    type: postgres
    access: proxy
    url: postgres:5432
    database: nexus_rag
    user: ${GRAFANA_DB_USER}
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      # Grafana 11+ reads the database from jsonData.database; the top-level
      # `database` above is honoured by the backend but the panel query path
      # needs it here, otherwise every panel reads "No data" with a
      # "no default database configured" notice even though the datasource
      # connects fine.
      database: nexus_rag
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: false
