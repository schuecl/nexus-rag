name: nexus-rag

networks:
  default:
    name: nexus-rag-net

volumes:
  alloy-data:
  grafana-data:
  loki-data:
  milvus-data:
  prometheus-data:
  postgres-data:
  qdrant-data:
  tempo-data:
  ollama-data:
  reranker-cache:
  ingestion-worker-cache:
  orchestration-mcp-cache:
  mongo-data:
  # NFR-12: original uploaded files, independent of Qdrant/Postgres. Shared
  # across ingestion-api and (once NFR-11 lands) ingestion-worker -- fine for
  # this single-node dev stack; production uses S3ObjectStore instead, which
  # doesn't have this same-filesystem constraint (see helm's externalObjectStore).
  object-store-data:
  nats-data:

services:
  # ---------------------------------------------------------------- storage
  postgres:
    # NFR-16: pinned to a specific patch release, not the floating "16" tag
    # -- same reasoning applies to every other image in this file that used
    # to say :latest, main-latest, or a bare major version.
    security_opt: ["no-new-privileges:true"]
    image: postgres:16.14
    environment:
      # POSTGRES_USER/PASSWORD stays the bootstrap superuser -- NFR-3: never
      # used for day-to-day app or Keycloak traffic (see APP_DB_USER/
      # KEYCLOAK_DB_USER below and infra/postgres/init-app-roles.sh, which
      # creates both as separate, non-superuser roles on first boot).
      POSTGRES_USER: ${POSTGRES_USER:-nexus_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_rag}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_rag}
      APP_DB_USER: ${APP_DB_USER:-nexus_rag_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-nexus_rag_app}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak_app}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_app}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      LITELLM_DB_USER: ${LITELLM_DB_USER:-litellm_app}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm_app}
      # #133: postgres-exporter's scrape role (pg_monitor + CONNECT only).
      # #221: provisioned by ensure-roles.sh, which the ensure-db-roles
      # one-shot re-runs on every `up` -- so enabling the observability
      # profile on a stack whose volume predates this role now works, where
      # before the role simply never appeared.
      MONITORING_DB_USER: ${MONITORING_DB_USER:-nexus_rag_monitor}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD:-nexus_rag_monitor}
      LITELLM_DB_NAME: ${LITELLM_DB_NAME:-litellm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-app-roles.sh:/docker-entrypoint-initdb.d/init-app-roles.sh:ro
      # #221: called by init-app-roles.sh on first boot, and re-run on every
      # `up` by the ensure-db-roles one-shot below -- the same file, so the two
      # paths can't diverge. Mounted at / rather than inside
      # docker-entrypoint-initdb.d deliberately: Postgres executes everything in
      # that directory itself, in filename order, which would run this twice
      # (harmlessly, since it's idempotent -- but relying on "ensure" sorting
      # before "init" is not a property worth depending on).
      - ./infra/postgres/ensure-roles.sh:/ensure-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.2
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      # NFR-15: require authenticated access even in dev -- anonymous
      # read/write to the vector store is never acceptable, network
      # isolation alone doesn't satisfy NFR-2's auditability (an
      # unauthenticated store can't attribute access to an identity).
      # Health check probes (/readyz, /livez, and this service's own TCP
      # healthcheck below) are exempt from Qdrant's own API-key enforcement.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:-dev-qdrant-readonly-key}
    ports:
      # Bound to localhost only -- nothing on the host network beyond this
      # machine should reach it directly; other containers still reach it
      # via the internal nexus-rag-net DNS name (qdrant:6333) regardless of
      # this host port binding.
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ queue
  nats:
    # NFR-11: durable ingestion job queue (common/job_queue.py) -- JetStream
    # (-js) gives ack/redelivery semantics so a worker crash or restart
    # mid-processing doesn't silently strand a document, unlike the
    # FastAPI BackgroundTasks mechanism this replaces. -sd persists stream
    # data to the mounted volume; -m exposes the monitoring HTTP endpoint
    # (port 8222, unauthenticated by design, used by the healthcheck below)
    # separate from the client protocol port (4222, which --auth protects).
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    image: nats:2.14.3-alpine
    command: ["-js", "-sd", "/data", "-m", "8222", "--auth", "${NATS_AUTH_TOKEN:-dev-nats-token}"]
    volumes:
      - nats-data:/data
    ports:
      # Bound to localhost only, same reasoning as qdrant's port binding
      # above -- other containers reach it via nats:4222 regardless.
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------- identity
  keycloak:
    # NFR-16: pinned to a recent release, up from 26.2 (the version this
    # whole realm/OBO setup was originally debugged against -- see
    # docs/dev-setup.md's eight-bug Keycloak list). Still >= 26.2, so
    # RFC 8693 token exchange (Section 7.7) stays supported, but this bump
    # specifically deserves a full down -v / up / realm-import / login
    # retest before trusting it -- more so than the other pins in this
    # commit, given how many of those eight bugs were version-behavior
    # surprises, not code bugs.
    security_opt: ["no-new-privileges:true"]
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      # NFR-3: Keycloak's own database/role, separate from the app's -- see
      # postgres service's init-app-roles.sh.
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak_app}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_app}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # #133: surface Keycloak login/logout/token and admin events in the
      # container log (→ Loki) for user-activity monitoring. The realm export
      # enables the jboss-logging events listener; by default it logs successful
      # events at DEBUG, so they never appear. Raise the success level to INFO
      # (errors stay a level up) so LOGIN / LOGIN_ERROR / LOGOUT / CODE_TO_TOKEN
      # and admin operations are visible without turning on DEBUG globally.
      KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_SUCCESS_LEVEL: info
      KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_ERROR_LEVEL: warn
      # Issue #75: LibreChat's openid-client discovery call refuses a plain
      # HTTP issuer outright ("only requests to HTTPS are allowed") -- adding
      # HTTPS here, alongside the existing HTTP listener (still used
      # unchanged by ingestion-api/orchestration-mcp's OIDC_ISSUERS), fixes
      # that without touching anything already working. KC_HOSTNAME is
      # deliberately left unset -- start-dev's request-based hostname
      # behavior (see docs/dev-setup.md's dual-issuer note) is what the rest
      # of this stack already relies on; the browser reaching this same
      # https://keycloak:8443 URL (for the OIDC authorization redirect, not
      # just LibreChat's backend calls) needs a `127.0.0.1 keycloak` entry in
      # the host's /etc/hosts -- see docs/dev-setup.md.
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/dev.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/dev.key
      # Confirmed live: enabling HTTPS on the main interface makes Keycloak's
      # management interface (port 9000, what the healthcheck below probes)
      # inherit HTTPS too by default -- http-management-scheme keeps it on
      # plain HTTP so the existing raw-HTTP /dev/tcp healthcheck still works.
      KC_HTTP_MANAGEMENT_SCHEME: http
    volumes:
      - ./infra/keycloak/realm-export:/opt/keycloak/data/import
      - ./infra/certs:/opt/keycloak/certs:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # KC_HEALTH_ENABLED moves /health* onto Keycloak's separate management
      # interface (default port 9000) rather than the main HTTP port (8080)
      # -- confirmed against a real run's "Management interface listening on
      # http://0.0.0.0:9000" log line, not assumed. Probing 8080 here left
      # Keycloak permanently "unhealthy" despite serving real traffic fine,
      # which blocked every service with depends_on: keycloak: condition:
      # service_healthy from ever starting.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # --------------------------------------------------------------- serving
  ollama:
    image: ollama/ollama:0.32.1
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama-model-init:
    image: ollama/ollama:0.32.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      GENERATION_MODEL: ${GENERATION_MODEL:-qwen2.5:7b-instruct}
    entrypoint: ["sh", "-c"]
    command:
      - |
        ollama pull "$$EMBEDDING_MODEL" && ollama pull "$$GENERATION_MODEL"
    restart: "no"

  reranker-service:
    build:
      context: .
      dockerfile: services/reranker-service/Dockerfile
      args:
        # CPU torch by default for local testing; a GPU host sets
        # TORCH_INDEX_URL to its CUDA index, an air-gapped build to its
        # internal mirror (see the Dockerfile's rationale).
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    # #111: mirror the chart's securityContext (_helpers.tpl) so the settings
    # that gate production get exercised on every dev run and every e2e.yml
    # run, instead of only in an environment nobody runs day to day. The
    # images already declare USER appuser (uid 10001); `user:` restates it so
    # a Dockerfile change can't silently drop it.
    user: "10001:10001"
    read_only: true
    # Issue #209: sized, unlike Kubernetes' emptyDir (which the chart already
    # bounds via ephemeral-storage limits) -- tmpfs is RAM-backed, so an
    # unsized mount lets Starlette's multipart spool (upload.py's
    # _read_bounded docstring) consume host memory before MAX_UPLOAD_BYTES
    # is ever checked. 64m is headroom above legitimate scratch use, not a
    # sizing of the largest accepted upload.
    tmpfs:
      - /tmp:size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      # #73: log verbosity, matching the other custom services.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # #134: distributed tracing -- disabled unless an OTLP endpoint is set
      # (e.g. a Tempo/otel-collector on the compose network). Dev default
      # samples everything when enabled; production should stay low.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    volumes:
      - reranker-cache:/srv/.cache/huggingface
    ports:
      - "127.0.0.1:8003:8003"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --------------------------------------------------------- custom services
  ingestion-api:
    build:
      context: .
      dockerfile: services/ingestion-api/Dockerfile
    # #111: mirror the chart's securityContext (_helpers.tpl) so the settings
    # that gate production get exercised on every dev run and every e2e.yml
    # run, instead of only in an environment nobody runs day to day. The
    # images already declare USER appuser (uid 10001); `user:` restates it so
    # a Dockerfile change can't silently drop it.
    user: "10001:10001"
    read_only: true
    # Issue #209: sized, unlike Kubernetes' emptyDir (which the chart already
    # bounds via ephemeral-storage limits) -- tmpfs is RAM-backed, so an
    # unsized mount lets Starlette's multipart spool (upload.py's
    # _read_bounded docstring) consume host memory before MAX_UPLOAD_BYTES
    # is ever checked. 64m is headroom above legitimate scratch use, not a
    # sizing of the largest accepted upload.
    tmpfs:
      - /tmp:size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      # #73: process-log verbosity/format, and NFR-2 SIEM export -- leaving
      # SIEM_SYSLOG_HOST unset keeps the export disabled (dev default).
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SIEM_SYSLOG_HOST: ${SIEM_SYSLOG_HOST:-}
      SIEM_SYSLOG_PORT: ${SIEM_SYSLOG_PORT:-514}
      SIEM_SYSLOG_PROTOCOL: ${SIEM_SYSLOG_PROTOCOL:-udp}
      SIEM_SYSLOG_FACILITY: ${SIEM_SYSLOG_FACILITY:-13}
      # #160: either/or vector backend -- qdrant (default) or milvus. One
      # backend per deployment; enabling milvus requires the milvus profile.
      VECTOR_BACKEND: ${VECTOR_BACKEND:-qdrant}
      MILVUS_URL: ${MILVUS_URL:-http://milvus:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-root:Milvus}
      # #134: distributed tracing -- disabled unless an OTLP endpoint is set
      # (e.g. a Tempo/otel-collector on the compose network). Dev default
      # samples everything when enabled; production should stay low.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      QUEUE_RECONCILE_INTERVAL_SECONDS: ${QUEUE_RECONCILE_INTERVAL_SECONDS:-15}
      QUEUE_RECONCILE_BATCH_SIZE: ${QUEUE_RECONCILE_BATCH_SIZE:-100}
      # NFR-3: non-superuser app role, distinct from POSTGRES_USER -- see
      # postgres service's init-app-roles.sh.
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-nexus_rag_app}:${APP_DB_PASSWORD:-nexus_rag_app}@postgres:5432/${POSTGRES_DB:-nexus_rag}
      # Issue #75: the third entry (https://keycloak:8443) is the issuer
      # stamped on tokens produced by LibreChat's OBO token-exchange call,
      # which now goes to Keycloak's HTTPS listener (openid-client's
      # discovery requires HTTPS -- see the keycloak/librechat services'
      # comments) -- confirmed live: exchanged tokens 403'd with "invalid
      # token: Invalid issuer" against this endpoint until this was added.
      OIDC_ISSUERS: http://keycloak:8080/realms/nexus-rag,http://localhost:8080/realms/nexus-rag,https://keycloak:8443/realms/nexus-rag
      OIDC_AUDIENCE: rag-app
      # Browser OIDC login (ARCHITECTURE.md Section 4.4). RAG_APP_KEYCLOAK_CLIENT_SECRET
      # is the same var already used by seed-sample-data/eval-retrieval below -- rag-app
      # is a confidential client, so the auth-code/refresh token exchanges in
      # app/routes/auth.py and app/deps.py are server-to-server. COOKIE_SECURE=false
      # because this dev stack serves the UI over plain http://localhost, where a
      # Secure-flagged cookie would never come back.
      OIDC_CLIENT_ID: rag-app
      RAG_APP_KEYCLOAK_CLIENT_SECRET: ${RAG_APP_KEYCLOAK_CLIENT_SECRET:-dev-rag-app-secret}
      OIDC_REDIRECT_URI: http://localhost:8001/auth/callback
      COOKIE_SECURE: "false"
      QDRANT_URL: http://qdrant:6333
      # NFR-15: full read/write key -- app/routes/curate.py updates/deletes
      # points directly (approve/reject/supersede); ingestion-worker (below)
      # is the one that now creates the collection and writes new points.
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      # app/routes/search.py's query-testing page proxies here, forwarding the
      # logged-in user's own access token (ARCHITECTURE.md Section 4.3).
      ORCHESTRATION_MCP_URL: http://orchestration-mcp:8002
      # NFR-12: durable original-file storage -- filesystem here (dev-only,
      # see common/object_store.py's FilesystemObjectStore); production uses
      # OBJECT_STORE_BACKEND=s3 (helm's externalObjectStore).
      OBJECT_STORE_BACKEND: filesystem
      OBJECT_STORE_PATH: /srv/object-store
      # NFR-11: publishes a job here on submit; ingestion-worker consumes it.
      NATS_URL: nats://nats:4222
      NATS_AUTH_TOKEN: ${NATS_AUTH_TOKEN:-dev-nats-token}
    volumes:
      - object-store-data:/srv/object-store
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      qdrant:
        condition: service_started
      nats:
        condition: service_healthy
      orchestration-mcp:
        condition: service_started

  ingestion-worker:
    # NFR-11: the durable consumer side of the queue ingestion-api publishes
    # to above -- actually does the parse/chunk/embed/store pipeline
    # (FR-3..FR-6), out of process so a crash mid-document doesn't strand it
    # (see services/ingestion-worker/app/processing.py).
    # #111: mirror the chart's securityContext (_helpers.tpl) so the settings
    # that gate production get exercised on every dev run and every e2e.yml
    # run, instead of only in an environment nobody runs day to day. The
    # images already declare USER appuser (uid 10001); `user:` restates it so
    # a Dockerfile change can't silently drop it.
    user: "10001:10001"
    read_only: true
    # Issue #209: sized, unlike Kubernetes' emptyDir (which the chart already
    # bounds via ephemeral-storage limits) -- tmpfs is RAM-backed, so an
    # unsized mount lets Starlette's multipart spool (upload.py's
    # _read_bounded docstring) consume host memory before MAX_UPLOAD_BYTES
    # is ever checked. 64m is headroom above legitimate scratch use, not a
    # sizing of the largest accepted upload.
    tmpfs:
      - /tmp:size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: services/ingestion-worker/Dockerfile
    environment:
      # #73: process-log verbosity/format, and NFR-2 SIEM export -- leaving
      # SIEM_SYSLOG_HOST unset keeps the export disabled (dev default).
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SIEM_SYSLOG_HOST: ${SIEM_SYSLOG_HOST:-}
      SIEM_SYSLOG_PORT: ${SIEM_SYSLOG_PORT:-514}
      SIEM_SYSLOG_PROTOCOL: ${SIEM_SYSLOG_PROTOCOL:-udp}
      SIEM_SYSLOG_FACILITY: ${SIEM_SYSLOG_FACILITY:-13}
      # #160: either/or vector backend -- qdrant (default) or milvus. One
      # backend per deployment; enabling milvus requires the milvus profile.
      VECTOR_BACKEND: ${VECTOR_BACKEND:-qdrant}
      MILVUS_URL: ${MILVUS_URL:-http://milvus:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-root:Milvus}
      # #134: distributed tracing -- disabled unless an OTLP endpoint is set
      # (e.g. a Tempo/otel-collector on the compose network). Dev default
      # samples everything when enabled; production should stay low.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      # NFR-3: non-superuser app role, distinct from POSTGRES_USER -- see
      # postgres service's init-app-roles.sh.
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-nexus_rag_app}:${APP_DB_PASSWORD:-nexus_rag_app}@postgres:5432/${POSTGRES_DB:-nexus_rag}
      QDRANT_URL: http://qdrant:6333
      # NFR-15: full read/write key -- this is now the service that creates
      # the collection and writes points, moved out of ingestion-api.
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key}
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      CHUNK_TARGET_WORDS: ${CHUNK_TARGET_WORDS:-512}
      CHUNK_OVERLAP_RATIO: ${CHUNK_OVERLAP_RATIO:-0.15}
      OBJECT_STORE_BACKEND: filesystem
      OBJECT_STORE_PATH: /srv/object-store
      NATS_URL: nats://nats:4222
      NATS_AUTH_TOKEN: ${NATS_AUTH_TOKEN:-dev-nats-token}
    volumes:
      - ingestion-worker-cache:/srv/.cache/huggingface
      - object-store-data:/srv/object-store
    ports:
      - "127.0.0.1:8004:8004"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      nats:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully

  orchestration-mcp:
    build:
      context: .
      dockerfile: services/orchestration-mcp/Dockerfile
    # #111: mirror the chart's securityContext (_helpers.tpl) so the settings
    # that gate production get exercised on every dev run and every e2e.yml
    # run, instead of only in an environment nobody runs day to day. The
    # images already declare USER appuser (uid 10001); `user:` restates it so
    # a Dockerfile change can't silently drop it.
    user: "10001:10001"
    read_only: true
    # Issue #209: sized, unlike Kubernetes' emptyDir (which the chart already
    # bounds via ephemeral-storage limits) -- tmpfs is RAM-backed, so an
    # unsized mount lets Starlette's multipart spool (upload.py's
    # _read_bounded docstring) consume host memory before MAX_UPLOAD_BYTES
    # is ever checked. 64m is headroom above legitimate scratch use, not a
    # sizing of the largest accepted upload.
    tmpfs:
      - /tmp:size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      # #73: process-log verbosity/format, and NFR-2 SIEM export -- leaving
      # SIEM_SYSLOG_HOST unset keeps the export disabled (dev default).
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SIEM_SYSLOG_HOST: ${SIEM_SYSLOG_HOST:-}
      SIEM_SYSLOG_PORT: ${SIEM_SYSLOG_PORT:-514}
      SIEM_SYSLOG_PROTOCOL: ${SIEM_SYSLOG_PROTOCOL:-udp}
      SIEM_SYSLOG_FACILITY: ${SIEM_SYSLOG_FACILITY:-13}
      # #160: either/or vector backend -- qdrant (default) or milvus. One
      # backend per deployment; enabling milvus requires the milvus profile.
      VECTOR_BACKEND: ${VECTOR_BACKEND:-qdrant}
      MILVUS_URL: ${MILVUS_URL:-http://milvus:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-root:Milvus}
      # #134: distributed tracing -- disabled unless an OTLP endpoint is set
      # (e.g. a Tempo/otel-collector on the compose network). Dev default
      # samples everything when enabled; production should stay low.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      # NFR-3: non-superuser app role, distinct from POSTGRES_USER -- see
      # postgres service's init-app-roles.sh.
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-nexus_rag_app}:${APP_DB_PASSWORD:-nexus_rag_app}@postgres:5432/${POSTGRES_DB:-nexus_rag}
      # Issue #75: the third entry (https://keycloak:8443) is the issuer
      # stamped on tokens produced by LibreChat's OBO token-exchange call,
      # which now goes to Keycloak's HTTPS listener (openid-client's
      # discovery requires HTTPS -- see the keycloak/librechat services'
      # comments) -- confirmed live: exchanged tokens 403'd with "invalid
      # token: Invalid issuer" against this endpoint until this was added.
      OIDC_ISSUERS: http://keycloak:8080/realms/nexus-rag,http://localhost:8080/realms/nexus-rag,https://keycloak:8443/realms/nexus-rag
      OIDC_AUDIENCE: rag-app
      QDRANT_URL: http://qdrant:6333
      # NFR-15: read-only key -- this service only ever calls query_points
      # (app/rag_search.py), never writes to Qdrant.
      QDRANT_API_KEY: ${QDRANT_READ_ONLY_API_KEY:-dev-qdrant-readonly-key}
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      RERANKER_URL: http://reranker-service:8003
      # issue #89: optional {content_type: multiplier} JSON map applied to
      # cross-encoder scores during reranking, e.g. '{"table": 1.15}' --
      # unset (the default) means no boost, every content type weighted 1.0.
      CONTENT_TYPE_BOOSTS: ${CONTENT_TYPE_BOOSTS:-}
    volumes:
      - orchestration-mcp-cache:/srv/.cache/huggingface
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      qdrant:
        condition: service_started
      reranker-service:
        condition: service_healthy

  # ---------------------------------------------------------- observability
  # Metrics: Prometheus scrapes every Nexus RAG service plus the queue,
  # database, identity provider, vector store, and telemetry backends.
  blackbox-exporter:
    # #133: HTTP health probes for services with no Prometheus /metrics
    # (Ollama, LibreChat, LiteLLM). Prometheus scrapes it with the target as a
    # param; it reports probe_success, which the chat-plane and flow dashboards
    # use for up/down instead of a non-existent up{job=...}.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    profiles: ["observability"]
    image: prom/blackbox-exporter:v0.28.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./infra/observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "127.0.0.1:9115:9115"

  nats-exporter:
    # #133: opt-in -- the observability stack starts only with
    # `--profile observability`, not on a bare `docker compose up`.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    profiles: ["observability"]
    image: natsio/prometheus-nats-exporter:0.20.1
    command:
      - -varz
      - -connz
      - -healthz
      # One mode, not a list: the exporter's -jsz flag accepts a single
      # filter (all|streams|consumers|...); "streams,consumers" is rejected
      # at startup ("invalid jsz filter"). `all` covers both.
      - -jsz=all
      - http://nats:8222
    ports:
      - "127.0.0.1:7777:7777"
    depends_on:
      nats:
        condition: service_healthy

  postgres-exporter:
    # #133: opt-in -- the observability stack starts only with
    # `--profile observability`, not on a bare `docker compose up`.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    profiles: ["observability"]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-nexus_rag}?sslmode=disable
      # #133 review finding 6: a dedicated monitoring role, not the app role.
      # The app role holds no pg_monitor membership, so most of the exporter's
      # collectors silently returned nothing against it -- and granting it
      # pg_monitor would have handed the credential the whole application uses
      # cluster-wide read of every session's queries and stats, which is the
      # separation NFR-3 exists to keep. init-app-roles.sh creates this role
      # with pg_monitor and CONNECT only.
      DATA_SOURCE_USER: ${MONITORING_DB_USER:-nexus_rag_monitor}
      DATA_SOURCE_PASS: ${MONITORING_DB_PASSWORD:-nexus_rag_monitor}
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      # #221: the roles this needs were added after the initial release,
      # so on a pre-existing volume they only exist because ensure-db-roles
      # ran. Waiting for it turns a race into an ordering.
      ensure-db-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  prometheus:
    # #133: opt-in -- the observability stack starts only with
    # `--profile observability`, not on a bare `docker compose up`.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    profiles: ["observability"]
    image: prom/prometheus:v3.11.3
    # #133 review finding 2: the Qdrant scrape credential used to be a literal
    # in the checked-in prometheus.yml, so rotating QDRANT_READ_ONLY_API_KEY
    # in .env broke the scrape with a silent 401. Render it into the data
    # volume (owned by the image's `nobody` user -- /etc/prometheus is not
    # writable) and point prometheus.yml's `credentials_file` at it. Finding 5
    # adds --web.enable-remote-write-receiver, which is what Tempo's
    # metrics-generator writes span metrics and service graphs into.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s' "$${QDRANT_READ_ONLY_API_KEY:-dev-qdrant-readonly-key}" \
          > /prometheus/qdrant-credentials
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=15d \
          --web.enable-lifecycle \
          --web.enable-remote-write-receiver
    environment:
      QDRANT_READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:-dev-qdrant-readonly-key}
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      alertmanager:
        condition: service_started

  alertmanager:
    # #133: opt-in -- the observability stack starts only with
    # `--profile observability`, not on a bare `docker compose up`.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    profiles: ["observability"]
    image: prom/alertmanager:v0.32.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  # Traces: services emit OTLP/HTTP to the collector, which batches and
  # forwards to Tempo. Grafana exposes the cross-service trace trees.
  tempo:
    # #133: opt-in -- the observability stack starts only with
    # `--profile observability`, not on a bare `docker compose up`.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    profiles: ["observability"]
    image: grafana/tempo:2.10.5
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  otel-collector:
    # #133: opt-in -- the observability stack starts only with
    # `--profile observability`, not on a bare `docker compose up`.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    depends_on:
      tempo:
        condition: service_started

  # Logs: Alloy discovers only containers in this Compose project and ships
  # their stdout/stderr to Loki. The Docker socket is read-only and this
  # collector is strictly a local-development component.
  loki:
    # #133: opt-in -- the observability stack starts only with
    # `--profile observability`, not on a bare `docker compose up`.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    profiles: ["observability"]
    image: grafana/loki:3.7.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infra/observability/loki.yml:/etc/loki/local-config.yaml:ro
      # /loki is the image's own data dir, already owned by loki's uid --
      # a custom path mounts root-owned and kills the ruler on mkdir.
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  docker-socket-proxy:
    # #133 review finding 3: Alloy used to bind-mount /var/run/docker.sock
    # directly. The `:ro` on that mount constrains the *file*, not the daemon
    # API reached through it -- anything that can talk to the socket can
    # create a privileged container and is therefore root on the host. That is
    # a large amount of authority to hand a log shipper.
    #
    # This proxy sits in front of the socket and allows exactly the endpoints
    # Alloy's discovery and log tailing need (GET /containers...), refusing
    # everything else -- notably POST /containers/create and /exec. Alloy
    # reaches it over the compose network instead of the socket, so its
    # capability drops from "root on the host" to "read container metadata and
    # stdout".
    #
    # It is not zero-risk: the proxy itself holds the socket, so a compromise
    # of *it* is the same exposure. It is a dev-only profile, never started by
    # a bare `docker compose up`, and the Helm chart has no equivalent (pods
    # log to the node's collector, no socket involved).
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    profiles: ["observability"]
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      # Default-deny: the image refuses every endpoint that isn't set to 1.
      CONTAINERS: 1
      # GET /networks, needed by Alloy's discovery.docker to compute the
      # network labels on each target. Found by running it: with this off,
      # discovery failed every refresh with "error while computing network
      # labels: 403 Forbidden" and Alloy shipped no container logs at all.
      # Still read-only, and still far short of socket access.
      NETWORKS: 1
      # Everything else stays off, spelled out rather than omitted so that a
      # future edit has to make an explicit decision to widen this.
      POST: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      IMAGES: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Deliberately not published to the host: reachable only from the compose
    # network, unlike the rest of the observability profile's UIs.
    expose:
      - "2375"

  alloy:
    # #133: opt-in -- the observability stack starts only with
    # `--profile observability`, not on a bare `docker compose up`.
    #
    # #111: no cap_drop here, unlike the rest of the observability stack.
    # Alloy takes ownership of its storage volume on first boot, and a
    # freshly-created named volume is root-owned -- with ALL dropped it loses
    # CAP_CHOWN/CAP_DAC_OVERRIDE and dies on
    # "mkdir /var/lib/alloy/data: permission denied". Same reasoning as
    # postgres and keycloak, which also drop privileges from root at startup.
    # Found by running it, not by reading it.
    security_opt: ["no-new-privileges:true"]
    profiles: ["observability"]
    image: grafana/alloy:v1.16.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      loki:
        condition: service_started
      docker-socket-proxy:
        condition: service_started

  grafana:
    # #133: opt-in -- the observability stack starts only with
    # `--profile observability`, not on a bare `docker compose up`.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    profiles: ["observability"]
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nexus-rag-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # #133: SVG flowchart panel (draw.io-style live topology). Downloaded
      # at startup; in an air-gapped install, pre-seed the plugin into
      # /var/lib/grafana/plugins instead and drop this line.
      # grafana-graphviz-panel renders the system-flow diagram from DOT
      # (#133). Listed here rather than installed by hand so a fresh
      # `docker compose up` has it -- a panel whose plugin is missing
      # renders as an empty box with no explanation.
      GF_INSTALL_PLUGINS: "andrewbmchugh-flow-panel,grafana-graphviz-panel,jdbranham-diagram-panel"
      # #133: consumed by the provisioned Postgres datasource (documents dashboard).
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_ro}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_ro}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

  syslog-collector:
    # #73/NFR-2 validation only: a stand-in SIEM that prints every syslog
    # message it receives to stdout, tagged [udp]/[tcp]/[tls], so the export
    # path can be watched end to end. Opt-in via the siem-debug profile --
    # production points SIEM_SYSLOG_HOST at the environment's real collector
    # (any IP/port/protocol, TLS certificates via SIEM_SYSLOG_CA_CERT /
    # _CLIENT_CERT / _CLIENT_KEY) and never runs this.
    #
    #   docker compose --profile siem-debug up -d syslog-collector
    #   SIEM_SYSLOG_HOST=syslog-collector docker compose up -d
    #   docker compose logs -f syslog-collector
    #
    # TLS (RFC 5425, port 6514) activates automatically when infra/certs has
    # been generated (generate-dev-certs.sh -- same certs Keycloak uses).
    security_opt: ["no-new-privileges:true"]
    profiles: ["siem-debug"]
    image: python:3.11-slim
    command: ["python3", "/collector.py"]
    environment:
      # All-interfaces by default, scoped to this container's own network
      # namespace: the services reach it over the compose network, and what
      # leaves the host is governed by the port bindings below. Overridable
      # like everything else (the script itself defaults to 127.0.0.1 when
      # run outside a container).
      BIND_HOST: ${SIEM_DEBUG_BIND_HOST:-0.0.0.0}
    volumes:
      - ./infra/syslog-collector/collector.py:/collector.py:ro
      # Certs for the TLS listener; point elsewhere to test against different
      # material (the script's TLS_CERT/TLS_KEY env picks them up at /certs).
      - ${SIEM_DEBUG_CERTS_DIR:-./infra/certs}:/certs:ro
    ports:
      # Published on the host's loopback by default: this debug collector
      # prints every audit event it receives, so it should not be reachable
      # from the LAN unless that is an explicit choice -- override
      # SIEM_DEBUG_HOST_IP (e.g. 0.0.0.0) to expose it deliberately. Host
      # ports are overridable too if 5514/6514 are taken.
      - "${SIEM_DEBUG_HOST_IP:-127.0.0.1}:${SIEM_DEBUG_UDP_PORT:-5514}:514/udp"
      - "${SIEM_DEBUG_HOST_IP:-127.0.0.1}:${SIEM_DEBUG_TCP_PORT:-5514}:514/tcp"
      - "${SIEM_DEBUG_HOST_IP:-127.0.0.1}:${SIEM_DEBUG_TLS_PORT:-6514}:6514/tcp"

  milvus:
    # #160: optional Milvus Standalone for the either/or vector-backend
    # comparison. Opt-in via the milvus profile; the default stack keeps
    # running Qdrant only. Standalone with embedded etcd and local storage --
    # one container, no etcd/minio sidecars. Milvus Lite is NOT used: it
    # lacks the sparse-vector path this project's hybrid retrieval needs.
    #
    #   VECTOR_BACKEND=milvus docker compose --profile milvus up -d
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    profiles: ["milvus"]
    image: milvusdb/milvus:v2.4.17
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
      # NFR-15: authenticated access in every environment; the services'
      # MILVUS_TOKEN carries user:password. Milvus's bootstrap credentials
      # are root:Milvus -- override both sides together in production.
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      # Loopback-only, like every other published port (#111): the vector
      # store holds the corpus and its gRPC port carries no authentication
      # in this dev configuration.
      - "127.0.0.1:19530:19530"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  attu:
    # #163: Milvus-only inspection UI, enabled with the same opt-in profile.
    # Attu does not support Qdrant; Qdrant's Apache-2.0 dashboard is already
    # bundled in its server image at http://127.0.0.1:6333/dashboard.
    #
    # v2.4.12 deliberately matches the Milvus 2.4.x compatibility line and
    # is Apache-2.0 licensed. Attu v2.6.0+ uses a proprietary Zilliz license
    # and must not be adopted without a separate dependency/license review.
    security_opt: ["no-new-privileges:true"]
    profiles: ["milvus"]
    image: zilliz/attu:v2.4.12
    environment:
      # Attu v2 expects host:port without a URL scheme. Credentials are
      # entered in its connection form rather than embedded in Compose.
      MILVUS_URL: milvus:19530
    ports:
      # This UI can inspect and mutate vector data, so keep it host-local.
      - "127.0.0.1:${ATTU_PORT:-8000}:3000"
    depends_on:
      milvus:
        condition: service_healthy

  ensure-db-roles:
    # #221: role provisioning that actually runs. init-app-roles.sh executes
    # from /docker-entrypoint-initdb.d, which Postgres runs exactly once on a
    # fresh data directory -- so every role added by a later release silently
    # never appeared on an existing deployment, and the failure surfaced as an
    # authentication error in some other service. It happened twice:
    # nexus_rag_monitor (#169) and grafana_ro (#133).
    #
    # This runs ensure-roles.sh on every `up`, against the running container.
    # Every statement in it is idempotent, so a stack whose volume predates a
    # new role picks it up on the next start with no manual step and no
    # volume recreation. Same shape as harden-audit-log below.
    #
    # Not profiled: roles are needed by the base stack, and the monitoring
    # role must exist before the observability profile is first enabled --
    # gating it behind that profile would recreate the original bug.
    security_opt: ["no-new-privileges:true"]
    image: postgres:16.14
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-nexus_rag}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_rag}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_rag}
      APP_DB_USER: ${APP_DB_USER:-nexus_rag_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-nexus_rag_app}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak_app}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_app}
      LITELLM_DB_USER: ${LITELLM_DB_USER:-litellm_app}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm_app}
      MONITORING_DB_USER: ${MONITORING_DB_USER:-nexus_rag_monitor}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD:-nexus_rag_monitor}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_ro}
    volumes:
      - ./infra/postgres/ensure-roles.sh:/ensure-roles.sh:ro
    entrypoint: ["/bin/bash", "/ensure-roles.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  harden-audit-log:
    # NFR-2: audit_log must be append-only from the app's own DB credentials
    # (APP_DB_USER, not the postgres superuser). Can't do this from
    # postgres's docker-entrypoint-initdb.d (init-app-roles.sh) -- the
    # audit_log table doesn't exist yet at that point, it's created by
    # SQLModel's create_all() (common/db.py's init_db(), called from
    # ingestion-api's lifespan) the first time that service starts. Runs
    # once ingestion-api reports healthy, connecting as the bootstrap
    # superuser (the only other place besides init-app-roles.sh that ever
    # does) to reassign table ownership away from APP_DB_USER entirely --
    # not just REVOKE while it's still the owner, which it could trivially
    # undo (owners always retain GRANT on their own objects; only losing
    # ownership outright closes that).
    image: postgres:16.14
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-nexus_rag}
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER:-nexus_rag}
      - -d
      - ${POSTGRES_DB:-nexus_rag}
      - -c
      - >-
        ALTER TABLE audit_log OWNER TO "${POSTGRES_USER:-nexus_rag}";
        REVOKE ALL ON audit_log FROM "${APP_DB_USER:-nexus_rag_app}";
        GRANT SELECT, INSERT ON audit_log TO "${APP_DB_USER:-nexus_rag_app}";
    depends_on:
      ingestion-api:
        condition: service_healthy
    restart: "no"

  provision-metrics-view:
    # #133: create the document_metrics view + grant it to grafana_ro, once
    # ingestion-api is healthy (so SQLModel has built the `documents` table this
    # view reads -- it cannot be created in postgres's initdb scripts, same as
    # harden-audit-log). Only needed by the Grafana Documents dashboard, so it
    # rides the observability profile; grafana_ro itself is created
    # unconditionally by init-app-roles.sh. Connects as the bootstrap superuser
    # to a mounted .sql file (no compose/shell interpolation of the regex).
    security_opt: ["no-new-privileges:true"]
    profiles: ["observability"]
    image: postgres:16.14
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-nexus_rag}
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER:-nexus_rag}
      - -d
      - ${POSTGRES_DB:-nexus_rag}
      - -f
      - /sql/document-metrics-view.sql
    volumes:
      - ./infra/postgres/document-metrics-view.sql:/sql/document-metrics-view.sql:ro
    depends_on:
      # #221: the roles this needs were added after the initial release,
      # so on a pre-existing volume they only exist because ensure-db-roles
      # ran. Waiting for it turns a race into an ordering.
      ensure-db-roles:
        condition: service_completed_successfully
      ingestion-api:
        condition: service_healthy
    restart: "no"

  seed-sample-data:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      INGESTION_API_URL: http://ingestion-api:8001
      RAG_APP_KEYCLOAK_CLIENT_SECRET: ${RAG_APP_KEYCLOAK_CLIENT_SECRET:-dev-rag-app-secret}
    depends_on:
      ingestion-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    restart: "no"

  # FR-30/FR-32: not started by a plain `docker compose up` -- run on demand
  # with `docker compose --profile eval run --rm eval-retrieval` once the
  # stack (and seed-sample-data) has finished, per "periodically re-evaluate".
  eval-retrieval:
    profiles: ["eval"]
    build:
      context: .
      dockerfile: scripts/Dockerfile
    command: ["python3", "evaluate_retrieval.py"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      ORCHESTRATION_MCP_URL: http://orchestration-mcp:8002
      RAG_APP_KEYCLOAK_CLIENT_SECRET: ${RAG_APP_KEYCLOAK_CLIENT_SECRET:-dev-rag-app-secret}
    depends_on:
      orchestration-mcp:
        condition: service_healthy
      seed-sample-data:
        condition: service_completed_successfully
    restart: "no"

  # ---------------------------------------------------- throwaway MPNexus stack
  mongodb:
    image: mongo:7.0.31
    security_opt: ["no-new-privileges:true"]
    volumes:
      - mongo-data:/data/db

  litellm:
    # NFR-16: pinned, up from the moving main-latest tag -- researched as
    # the current release at pin time, not exhaustively verified to pull
    # cleanly (this is C7's "entirely LibreChat's own pipeline, not this
    # project's concern" territory, so lower scrutiny than Keycloak above).
    # -database variant (same tag as the plain image) bundles the Prisma
    # toolchain needed to run migrations against DATABASE_URL below --
    # the plain litellm image has no DB support and just logs "Not
    # connected to a DB" instead of persisting virtual keys/spend.
    security_opt: ["no-new-privileges:true"]
    image: ghcr.io/berriai/litellm-database:v1.93.0
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-litellm-master-key}
      # NFR-3: own non-superuser role and database, isolated from the app's
      # and Keycloak's -- see infra/postgres/init-app-roles.sh.
      DATABASE_URL: postgresql://${LITELLM_DB_USER:-litellm_app}:${LITELLM_DB_PASSWORD:-litellm_app}@postgres:5432/${LITELLM_DB_NAME:-litellm}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      ollama-model-init:
        condition: service_started
      postgres:
        condition: service_healthy

  librechat:
    # NFR-16: pinned, up from :latest -- deliberately held at v0.8.7 rather
    # than whatever's newest, since that's the exact version Section 7.7's
    # OBO/addUserJwtToken integration recipe was verified against
    # (REQUIREMENTS.md: "LibreChat 0.8.7 (confirmed version in use)").
    # Bumping past it would mean re-verifying that recipe, not just pinning.
    security_opt: ["no-new-privileges:true"]
    image: ghcr.io/danny-avila/librechat:v0.8.7
    volumes:
      - ./infra/librechat/librechat.yaml:/app/librechat.yaml:ro
      # Issue #75: trusted by Node's default TLS store via NODE_EXTRA_CA_CERTS
      # below, so the openid-client discovery/token calls to Keycloak's
      # self-signed HTTPS cert (infra/certs/generate-dev-certs.sh) don't fail
      # TLS verification.
      - ./infra/certs/ca.crt:/certs/ca.crt:ro
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      NODE_ENV: development
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      # LibreChat's own domain config, used to build absolute callback/redirect
      # URLs (paired with OPENID_CALLBACK_URL's relative path below). This is
      # genuinely served now by the librechat-proxy service (nginx terminating
      # TLS with the same dev cert, forwarding plaintext to this container) --
      # LibreChat itself (v0.8.7, api/server/index.js) has no built-in HTTPS
      # listener, so without that proxy this would just be a string that
      # doesn't correspond to a real endpoint.
      DOMAIN_CLIENT: https://localhost:3080
      DOMAIN_SERVER: https://localhost:3080
      # Required to show the OIDC login button at all -- confirmed live:
      # without this, LibreChat starts fine but silently has no OIDC login
      # option in the UI (LibreChat's own .env.example ships ALLOW_SOCIAL_LOGIN
      # defaulted to false). This isn't a CSRF/security toggle, just a feature
      # switch for the whole social/OIDC login family this config only uses
      # OpenID from.
      ALLOW_SOCIAL_LOGIN: "true"
      # Root cause (confirmed via api/strategies/openidStrategy.js, v0.8.7):
      # setupOpenId() calls openid-client's client.discovery() with no
      # `execute: [allowInsecureRequests]` option, so it unconditionally
      # throws "only requests to HTTPS are allowed" for a plain-HTTP issuer --
      # this was never about the callback URL. Keycloak now has a real HTTPS
      # listener (see the keycloak service's KC_HTTPS_* vars) reachable at
      # this same hostname from both this container (Compose DNS) and the
      # browser (needs a `127.0.0.1 keycloak` /etc/hosts entry on the host --
      # see docs/dev-setup.md -- since Keycloak's discovery metadata,
      # including the browser-facing authorization_endpoint, is stamped with
      # whichever hostname the request came in on; start-dev's default
      # request-based behavior is left as-is rather than pinning KC_HOSTNAME,
      # to avoid disturbing the already-working dual-issuer setup ingestion-
      # api/orchestration-mcp rely on).
      OPENID_ISSUER: https://keycloak:8443/realms/nexus-rag
      OPENID_CLIENT_ID: librechat
      OPENID_CLIENT_SECRET: ${LIBRECHAT_KEYCLOAK_CLIENT_SECRET:-dev-librechat-secret}
      # LibreChat's configureOpenId() function (api/server/socialLogins.js) only
      # runs at all if OPENID_CLIENT_ID/OPENID_ISSUER/OPENID_SCOPE/
      # OPENID_SESSION_SECRET are ALL present. This was missing, causing the entire
      # OIDC setup to be skipped silently (confirmed: no OIDC requests even attempted).
      # Value matches LibreChat's own .env.example default.
      OPENID_SCOPE: "openid profile email"
      # Relative path, per LibreChat's own .env.example -- the code builds the
      # actual callback as `DOMAIN_SERVER + OPENID_CALLBACK_URL`
      # (openidStrategy.js's setupOpenId()), so the previous absolute-URL
      # value here concatenated into a malformed
      # "https://localhost:3080https://localhost:3080/..." callback.
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_SESSION_SECRET: dev-session-secret-change-me
      OPENID_USE_PKCE: "true"
      OPENID_REUSE_TOKENS: "true"
      # LibreChat's own session JWTs (separate from Keycloak's OIDC tokens) --
      # required at startup regardless of auth method, confirmed live: LibreChat
      # refuses to start ("JwtStrategy requires a secret or key") without these.
      # No fixed-length requirement (any string works as an HMAC secret), unlike
      # CREDS_KEY/CREDS_IV below.
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:-6d5695c76c088051803a2711a694dc2a8c3e184b97ca2696639b663e289cb6bd}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:-e6ee049ff1278d2d966accf4a498589cfa8f2e90a239a36195ecea193606444c}
      # AES-256-CBC key/IV LibreChat uses to encrypt credentials it stores in
      # MongoDB (e.g. user-provided plugin API keys) -- also required at
      # startup, and unlike JWT_SECRET/JWT_REFRESH_SECRET these have a strict
      # length requirement LibreChat validates: CREDS_KEY must decode to exactly
      # 32 bytes (64 hex chars), CREDS_IV to exactly 16 bytes (32 hex chars).
      # Generated with `openssl rand -hex 32` / `openssl rand -hex 16`.
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:-b981603e3853e792749bd57a37263dcac98f05e9bcc3221b28ea9ce1d31407f6}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:-59ac382baf239caa9f8bb22863d45e41}
      # #193: the API key LibreChat presents to the LiteLLM custom endpoint.
      # infra/librechat/librechat.yaml has `apiKey: "${LITELLM_MASTER_KEY}"` and
      # LibreChat only substitutes that from *this container's* environment, so
      # without this line the substitution is empty and every LiteLLM-backed
      # model fails with "Missing API Key for LiteLLM" -- a message about the
      # LiteLLM service key, not the user's (working) Keycloak login. Matches
      # LiteLLM's own master_key default.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-litellm-master-key}
    # No host port mapping here anymore -- librechat-proxy below is what the
    # host's :3080 actually reaches (issue #75: this container has no HTTPS
    # listener of its own).
    depends_on:
      mongodb:
        condition: service_started
      # LibreChat registers its passport "openid" strategy at boot by fetching
      # Keycloak's /.well-known/openid-configuration -- if that fails (Keycloak
      # container started but not yet actually serving, still mid realm-import)
      # the strategy setup fails and never retries, so every later login
      # attempt 500s with "Unknown authentication strategy \"openid\"" even
      # once Keycloak comes up. condition: service_started (the bare depends_on
      # this used to be) doesn't wait for that; service_healthy does -- same
      # fix ingestion-api/orchestration-mcp already needed for their own
      # Keycloak dependency, found live the same way (see the Keycloak
      # healthcheck bullet above).
      keycloak:
        condition: service_healthy
      litellm:
        condition: service_started
      orchestration-mcp:
        condition: service_started

  # Issue #75: terminates TLS for LibreChat's browser-facing :3080 -- LibreChat
  # v0.8.7 (api/server/index.js) always calls a plain http app.listen(), so a
  # real https://localhost:3080 (required for the OIDC redirect round-trip)
  # has to be fronted by something else.
  librechat-proxy:
    image: nginx:1.27.4-alpine
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./infra/nginx/librechat-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs/dev.crt:/certs/dev.crt:ro
      - ./infra/certs/dev.key:/certs/dev.key:ro
    ports:
      - "127.0.0.1:3080:3080"
    depends_on:
      librechat:
        condition: service_started
